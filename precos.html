<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Preços e estoque — LB Marketplace</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Oswald:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f3ec;--card:#fff;--text:#1d1a14;--dim:#6f6858;--line:#e7e1d3;--gold:#b8902f;--gold2:#d9b45a;--ok:#2f8f5b;--err:#c0392b;--chip:#f3ecdc}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;font-size:15px;line-height:1.45}
.top{background:#13110c;color:#fff;padding:18px 16px}
.top .in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:14px}
.logo{font-family:Oswald,sans-serif;font-size:26px;color:var(--gold2);letter-spacing:1px}
.logo small{display:block;font-family:Inter;font-size:9px;letter-spacing:3px;color:#cdb98a}
.top h1{font-family:Oswald,sans-serif;font-weight:500;font-size:18px;margin:0 0 0 auto;text-align:right}
.top h1 span{display:block;font-family:Inter;font-size:13px;color:#cdb98a;font-weight:500}
main{max-width:760px;margin:0 auto;padding:18px 16px 120px}
.intro{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.intro b{color:var(--gold)}
.intro ul{margin:8px 0 0 18px;padding:0;color:var(--dim);font-size:14px}
.busca{width:100%;border:1px solid var(--line);border-radius:10px;padding:12px;font:inherit;background:#fffdf8;margin-bottom:12px}
.filtros{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--chip);border-radius:20px;padding:7px 12px;font-size:13.5px;cursor:pointer;user-select:none}
.chip.on{background:var(--gold);border-color:var(--gold);color:#fff}
.prod{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px;display:grid;grid-template-columns:76px minmax(0,1fr);gap:12px}
.prod.feito{border-color:#bfe0cc;background:#fbfffc}
.prod img,.prod .sem{width:76px;height:100px;border-radius:9px;object-fit:cover;background:#f1ece0;display:block}
.nome{font-weight:600;font-size:14px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.info{font-size:12.5px;color:var(--dim);margin-top:3px}
.campos{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}
.campos label{font-size:12px;font-weight:600;color:var(--dim);display:block;margin-bottom:3px}
.campos input,.nota{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px;font:inherit;font-size:16px;background:#fffdf8;color:var(--text)}
.campos input:focus,.nota:focus,.busca:focus,textarea:focus{outline:2px solid var(--gold2);border-color:var(--gold2)}
.nota{font-size:14px;margin-top:8px;display:none}
.nota.on{display:block}
.mais{background:none;border:0;color:var(--gold);font:inherit;font-size:12.5px;font-weight:600;padding:6px 0 0;cursor:pointer}
.ganho{font-size:12.5px;margin-top:6px;font-weight:600}
.est{margin-top:10px;border-top:1px dashed var(--line);padding-top:8px}
.est-t{font-size:12px;font-weight:600;color:var(--dim);margin-bottom:6px}
.est-l{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px solid #f1ece0}
.est-l span{font-size:13.5px;min-width:0}.est-l small{display:block;font-size:11px;color:var(--dim)}
.mp{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.3px;border-radius:6px;padding:2px 6px;margin-right:4px;color:#fff}.mp.shopee{background:#ee4d2d}.mp.tiktok{background:#111}
.cal{margin-top:9px}.cal-t{font-size:12px;font-weight:600;color:var(--dim);margin-bottom:5px}.cal-b{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.cal button{border:1px solid var(--line);background:#fffaf0;border-radius:10px;padding:8px 4px;font:inherit;font-size:12.5px;cursor:pointer;color:var(--text);line-height:1.2}.cal button.on{border-color:var(--gold);background:#fbf1d9;box-shadow:0 0 0 1px var(--gold);font-weight:700}
.pv{font-size:12.5px;margin-top:6px;background:#f6f1e4;border-radius:9px;padding:8px 10px;display:none}.pv.on{display:block}.pv b{color:var(--gold)}
.ej{background:#fbf1d9;border:1px solid #ecd9a6;border-radius:10px;padding:10px 12px;margin-top:10px;font-size:13.5px}
.nv{margin-top:10px;border-top:1px dashed var(--line);padding-top:8px}.nv-c{background:#fbfaf6;border:1px solid var(--line);border-radius:10px;padding:9px;margin-bottom:8px}
.nv-c .lin{display:flex;gap:8px;align-items:center}.nv-c input.cor{flex:1;min-width:0;border:1px solid var(--line);border-radius:9px;padding:9px;font:inherit;font-size:16px;background:#fff}
.nv-c .x{border:0;background:#f3e2df;color:var(--err);border-radius:8px;width:36px;height:36px;font-size:18px;cursor:pointer;flex:none}
.nv-c .tl{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:6px;margin-top:7px}.nv-c .tl label{font-size:11.5px;color:var(--dim);text-align:center}.nv-c .tl input{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 4px;font:inherit;font-size:16px;text-align:center;background:#fff}
.nv-c .ft{display:flex;align-items:center;gap:8px;margin-top:7px;font-size:12.5px}.nv-c .ft img{width:40px;height:52px;object-fit:cover;border-radius:6px}.nv-c .ft label{color:var(--gold);font-weight:600;cursor:pointer}
.add{border:1px dashed var(--gold);background:#fffaf0;color:var(--gold);border-radius:10px;padding:9px 12px;font:inherit;font-weight:600;font-size:13.5px;cursor:pointer;width:100%}
.novo{display:block;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:14px;color:var(--gold);font-weight:600;text-decoration:none}
.tec{margin-top:8px}.tec label{font-size:12px;font-weight:600;color:var(--dim);display:block;margin-bottom:3px}.tec input{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px;font:inherit;font-size:16px;background:#fffdf8;color:var(--text)}
.est-l input.sku{width:150px;text-transform:uppercase}.tudo .est-l input{width:64px}.tudo .est-l input.sku{width:118px;font-size:14px}.est-l input{width:90px;flex:none;border:1px solid var(--line);border-radius:9px;padding:9px;font:inherit;font-size:16px;background:#fffdf8;text-align:center}
.sug{display:none;margin-top:8px}.sug.on{display:block}
.sug-t{font-size:12px;font-weight:600;color:var(--dim);margin-bottom:5px}
.sug-b{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.sug button{border:1px solid var(--line);background:#fffaf0;border-radius:10px;padding:8px 6px;font:inherit;cursor:pointer;text-align:center;color:var(--text)}
.sug button.on{border-color:var(--gold);background:#fbf1d9;box-shadow:0 0 0 1px var(--gold)}
.sug button b{display:block;font-size:15px;color:var(--gold)}.sug button span{display:block;font-size:11px;color:var(--dim);line-height:1.25}
.ganho.ok{color:var(--ok)}.ganho.mal{color:var(--err)}
.barra{position:fixed;left:0;right:0;bottom:0;background:#13110c;color:#fff;padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
.barra .in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:12px}
.barra .cont{font-size:14px;flex:1}
.barra .cont b{color:var(--gold2)}
.btn{border:0;border-radius:10px;padding:13px 18px;font:inherit;font-weight:700;cursor:pointer;background:var(--gold);color:#fff;font-size:15px}
.btn:disabled{opacity:.6;cursor:default}
textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px;font:inherit;min-height:80px;background:#fffdf8}
.msg{padding:14px;border-radius:12px;margin:12px 0;font-size:14px}
.msg.err{background:#fdecea;color:var(--err)}
.msg.ok{background:#e9f6ee;color:var(--ok)}
.carregando{text-align:center;color:var(--dim);padding:40px 0}
.fim{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:28px 18px;text-align:center}
.fim h2{font-family:Oswald,sans-serif;font-weight:500;margin:0 0 8px}
@media(max-width:420px){.top h1{font-size:15px}}
</style>
</head>

<script>
const API='https://lb-shopee-gmv.vercel.app/api/pedido-produto';
const T=new URLSearchParams(location.search).get('t')||'';
const SO_EST=new URLSearchParams(location.search).get('m')==='estoque'; // 13/11/2026 (Liz): link só de estoque
const SO_SKU=new URLSearchParams(location.search).get('m')==='sku'; // 18/11/2026 (Dona Chic): link só de SKU
const COM_SKU=new URLSearchParams(location.search).get('m')==='tudo'; // 28/11/2026 (Dona Chic): preço + estoque + SKU no mesmo link
if(COM_SKU)document.documentElement.classList.add('tudo');
const SO_REC=new URLSearchParams(location.search).get('m')==='receber'; // 24/11/2026 (CS Modas): só quanto quer receber limpo
const SO_LUC=new URLSearchParams(location.search).get('m')==='lucro'; // 25/11/2026 (CS Modas): custo + lucro limpo por peça; receber = custo + lucro
const SO_MIN=SO_REC||SO_LUC;
const QS=new URLSearchParams(location.search);const L_URL=QS.get('l');const F_URL=['ambos','shopee','tiktok'].includes(QS.get('f'))?QS.get('f'):''; // 20/11/2026 (Jhanval): &l=es força espanhol, &f=ambos traz Shopee + TikTok
const CHAVE='lbPrecos_'+T+(SO_EST?'_est':'')+(SO_SKU?'_sku':'')+(SO_REC?'_rec':'')+(SO_LUC?'_luc':'')+(COM_SKU?'_tudo':'');
let ITENS=[],R={},OBS='',FILTRO='todos',BUSCA='',L='pt';
// textos (12/11/2026): português por padrão; espanhol pra quem tem clientes.linkProdutosIdioma = 'es' (Killa, Heidy)
const TX={pt:{tit:'Preços e estoque',inval:'Link inválido. Peça um novo link pra equipe LB.',erro:'Erro',vazio:'Não encontramos produtos ativos na sua loja. Fale com a equipe LB.',falha:'Não conseguimos carregar seus produtos.',denovo:'Tentar de novo',intro:'Oi 👋 Em cada produto, escreva:<ul><li><b>Custo:</b> quanto custa pra você cada peça.</li><li><b>Quero receber:</b> quanto você quer que sobre <b>na sua conta por peça vendida</b>, já descontadas as taxas do marketplace. A gente calcula o preço de venda. Depois de escrever o custo, aparecem 3 sugestões pra você escolher.</li><li><b>Tecido e qualidade:</b> de que tecido é a peça e se é <b>superior (premium)</b> ou <b>mais simples</b>. Mesmo modelo em 2 tecidos = valor diferente em cada um.</li><li><b>Cores que faltam:</b> toque em <b>“+ Adicionar cor”</b>, escreva o nome, a quantidade e, se puder, mande uma foto.</li><li><b>Estoque:</b> quantas peças você tem de cada cor e tamanho. Se não tiver, coloque 0.</li></ul><div class="info" style="margin-top:8px">Pode preencher só alguns e mandar o resto depois. O que você escreve fica salvo neste celular.</div>',busca:'Buscar produto…',todos:'Todos',faltam:'Faltam',feitos:'Preenchidos',obsT:'Algum comentário?',opc:'(opcional)',obsPh:'Ex.: os vestidos tamanho GG custam mais…',hoje:'Preço hoje: ',vars:' variações',custo:'Custo (R$)',tec:'Tecido',tecPh:'Ex.: linho, viscose, malha…',calT:'Qualidade do tecido deste modelo',cal:['Mais simples (mais barato)','Normal','Superior (premium)'],pv:(l)=>`Preço de venda aproximado: ${l} — e pra você ficam`,pvL:' limpos por peça',addCor:'+ Adicionar cor que falta neste anúncio',addTal:'+ Adicionar tamanho que falta',corPh:'Nome da cor (ex.: Vinho)',talPh:'Tamanho (ex.: GG)',qtd:'Quantidade',fotoCor:'📷 Foto desta cor (opcional)',fotoTroca:'Trocar foto',subindo:'Enviando foto…',fotoErro:'A foto não foi. Tente de novo.',nvT:'Cores/tamanhos novos (a equipe LB cria no anúncio)',novoProd:'Tem um produto que não está nesta lista? Envie por aqui →',receber:'Quero receber LIMPO (R$)',estT:'Estoque por cor e tamanho',estU:'Estoque (peças)',hojeQ:'hoje: ',nota:'Observação',maisNota:'+ O preço muda por tamanho/cor',notaPh:'Ex.: tamanho GG receber 40',nenhum:'Nenhum produto.',ganho:'Seu lucro por peça: ',sugT:'Sugestão da LB pra quanto receber (toque pra usar):',sug:['Vender mais','Equilibrado','Mais lucro'],vende:'vende por ~',na:' na ',atencao:(v,c)=>`Atenção: você receberia ${v} e a peça custa ${c}`,de:' de ',preench:' produtos preenchidos',enviando:'Enviando…',enviar:'Enviar',pronto:'Pronto, muito obrigado! ✅',recebemos:(n)=>`Recebemos ${n} produto${n>1?'s':''}. A equipe LB vai ajustar os preços e o estoque e te avisa.`,mudar:'Se quiser mudar algo ou preencher os que faltam, abra este mesmo link de novo.',naoEnviou:'Não foi possível enviar: '},
es:{tit:'Precios y stock',inval:'Enlace inválido. Pida un nuevo enlace al equipo LB.',erro:'Error',vazio:'No encontramos productos activos en su tienda. Hable con el equipo LB.',falha:'No pudimos cargar sus productos.',denovo:'Intentar de nuevo',intro:'Hola 👋 Este enlace es para dejar <b>todo correcto</b> en sus anuncios de Shopee y TikTok. Para cada producto, escriba:<ul><li><b>Costo:</b> cuánto le cuesta a usted cada pieza.</li><li><b>Quiero recibir:</b> cuánto quiere que le quede <b>en su cuenta por cada pieza vendida</b>, ya descontadas las tasas del marketplace. Nosotros calculamos el precio de venta. Después de escribir el costo, aparecen 3 sugerencias para elegir.</li><li><b>Tela y calidad:</b> de qué tela es la pieza y si es una tela <b>superior (premium)</b> o <b>más simple</b>. Si tiene el mismo modelo en dos telas (ej.: alfaiataria premium y linhão), ponga un valor distinto en cada uno: la premium recibe más, la más simple recibe menos.</li><li><b>Stock:</b> cuántas piezas tiene de cada color y talla. Si no tiene, ponga 0.</li><li><b>Colores que faltan:</b> si un color o talla no aparece en el anuncio, toque <b>“+ Agregar un color”</b>, escriba el nombre, la cantidad y, si puede, mande una foto.</li></ul><div class="info" style="margin-top:8px">Puede completar solo algunos y enviar después el resto. Lo que escribe queda guardado en este celular.</div>',busca:'Buscar producto…',todos:'Todos',faltam:'Faltan',feitos:'Completados',obsT:'¿Algún comentario?',opc:'(opcional)',obsPh:'Ej.: los vestidos talla GG cuestan más…',hoje:'Precio hoy: ',vars:' variaciones',custo:'Costo (R$)',tec:'Tela',tecPh:'Ej.: lino, viscosa, punto…',calT:'Calidad de la tela de este modelo',cal:['Más simple (más barata)','Normal','Superior (premium)'],pv:(l)=>`Precio de venta aproximado: ${l} — y a usted le quedan`,pvL:' limpios por pieza',addCor:'+ Agregar un color que falta en este anuncio',addTal:'+ Agregar una talla que falta',corPh:'Nombre del color (ej.: Vino)',talPh:'Talla (ej.: GG)',qtd:'Cantidad',fotoCor:'📷 Foto de este color (opcional)',fotoTroca:'Cambiar foto',subindo:'Subiendo foto…',fotoErro:'La foto no se envió. Intente de nuevo.',nvT:'Colores/tallas nuevos (el equipo LB los crea en el anuncio)',novoProd:'¿Tiene un producto que no está en esta lista? Envíelo aquí →',receber:'Quiero recibir LIMPIO (R$)',estT:'Stock por color y talla',estU:'Stock (piezas)',hojeQ:'hoy: ',nota:'Nota',maisNota:'+ El precio cambia por talla/color',notaPh:'Ej.: talla GG recibir 40',nenhum:'Ningún producto.',ganho:'Su ganancia por pieza: ',sugT:'Sugerencia de LB para cuánto recibir (toque para usar):',sug:['Vender más','Equilibrado','Más ganancia'],vende:'se vende a ~',na:' en ',atencao:(v,c)=>`Atención: recibiría ${v} y la pieza cuesta ${c}`,de:' de ',preench:' productos completados',enviando:'Enviando…',enviar:'Enviar',pronto:'¡Listo, muchas gracias! ✅',recebemos:(n)=>`Recibimos ${n} producto${n>1?'s':''}. El equipo LB va a ajustar los precios y le avisa.`,mudar:'Si quiere cambiar algo o completar los que faltan, abra este mismo enlace de nuevo.',naoEnviou:'No se pudo enviar: '}};
const TXE={pt:{tit:'Estoque',intro:'Oi 👋 Em cada produto, escreva <b>quantas peças você tem de cada cor e tamanho</b>. Se não tiver, coloque 0.<div class="info" style="margin-top:8px">Pode preencher só alguns e mandar o resto depois. O que você escreve fica salvo neste celular.</div>',recebemos:(n)=>`Recebemos ${n} produto${n>1?'s':''}. A equipe LB vai ajustar o estoque em todos os marketplaces e te avisa.`,obsPh:'Ex.: a cor preta vai chegar semana que vem…'},
es:{tit:'Stock',intro:'Hola 👋 Para cada producto, escriba <b>cuántas piezas tiene de cada color y talla</b>. Si no tiene, ponga 0.<div class="info" style="margin-top:8px">Puede completar solo algunos y enviar después el resto. Lo que escribe queda guardado en este celular.</div>',recebemos:(n)=>`Recibimos ${n} producto${n>1?'s':''}. El equipo LB va a ajustar el stock en todos los marketplaces y le avisa.`,obsPh:'Ej.: el color negro llega la próxima semana…'}};
const TXS={pt:{tit:'SKU dos produtos',intro:'Oi 👋 Em cada produto, escreva o <b>SKU (seu código interno)</b> de cada cor e tamanho — do jeito que você usa no seu estoque ou sistema. Embaixo aparece o SKU que está hoje no anúncio, se tiver.<div class="info" style="margin-top:8px">Pode preencher só alguns e mandar o resto depois. O que você escreve fica salvo neste celular.</div>',recebemos:(n)=>`Recebemos ${n} produto${n>1?'s':''}. A equipe LB vai gravar os SKUs em todos os marketplaces e te avisa.`,obsPh:'Ex.: os kits ainda não têm código…',estT:'SKU de cada cor/tamanho',estU:'SKU do produto',hojeS:'hoje: '},
es:{tit:'SKU de los productos',intro:'Hola 👋 Para cada producto, escriba el <b>SKU (su código interno)</b> de cada color y talla, como lo usa en su stock o sistema. Abajo aparece el SKU que hoy tiene el anuncio, si tiene.<div class="info" style="margin-top:8px">Puede completar solo algunos y enviar después el resto. Lo que escribe queda guardado en este celular.</div>',recebemos:(n)=>`Recibimos ${n} producto${n>1?'s':''}. El equipo LB va a grabar los SKU en todos los marketplaces y le avisa.`,obsPh:'Ej.: los kits todavía no tienen código…',estT:'SKU de cada color/talla',estU:'SKU del producto',hojeS:'hoy: '}};
const t=(k)=>(SO_SKU&&(TXS[L]||TXS.pt)[k]!=null?(TXS[L]||TXS.pt)[k]:SO_EST&&(TXE[L]||TXE.pt)[k]!=null?(TXE[L]||TXE.pt)[k]:(TX[L]||TX.pt)[k]);
const $=(s)=>document.querySelector(s);
const esc=(s)=>String(s??'').replace(/[&<>"]/g,(c)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const brl=(n)=>'R$ '+Number(n).toFixed(2).replace('.',',');
function num(v){let s=String(v??'').replace(/r\$|\s/gi,'');if(!s)return null;if(/,\d{1,2}$/.test(s))s=s.replace(/\./g,'').replace(',','.');else s=s.replace(/,/g,'');const n=Number(s);return Number.isFinite(n)?n:null}
function guardar(){try{localStorage.setItem(CHAVE,JSON.stringify({R,OBS}))}catch(e){}}
function temEst(ch){const e=(R[ch]||{}).estoque||{};return Object.values(e).some(v=>String(v??'').trim()!=='')}
function temSku(ch){const e=(R[ch]||{}).sku||{};return Object.values(e).some(v=>String(v??'').trim()!=='')}
function preenchido(ch){if(SO_SKU)return temSku(ch);if(SO_REC)return num((R[ch]||{}).receber)!=null;if(SO_LUC)return num((R[ch]||{}).custo)!=null&&num((R[ch]||{}).lucro)!=null;const r=R[ch]||{};return (!SO_EST&&(num(r.receber)!=null||(COM_SKU&&temSku(ch))||String(r.tecido||'').trim()!==''||temNv(ch)))||temEst(ch)}
function tallasDe(i){const vs=(i.variacoes||[]).map(v=>vNome(v).split(',').map(x=>x.trim()));if(vs.some(p=>p.length>1))return {tipo:'cor',tallas:[...new Set(vs.map(p=>p[p.length-1]))]};if(vs.length&&vs.every(p=>SZ.test(p[0])))return {tipo:'talla',tallas:[]};return {tipo:'cor',tallas:vs.length?[]:['P','M','G','GG']}}
const SZ=/^(PP|P|M|G|GG|XG|XGG|EG|EGG|G\d|\d{2}|U|UNICO|ÚNICO|TAMANHO ÚNICO|TAMANHO UNICO)$/i;

$('#enviar').onclick=async()=>{
  const respostas={};for(const i of ITENS){const r=R[i.chave];if(SO_SKU){if(r&&temSku(i.chave))respostas[i.chave]={sku:r.sku};continue}if(SO_EST){if(r&&temEst(i.chave))respostas[i.chave]={estoque:r.estoque};continue}if(SO_LUC){if(r&&num(r.custo)!=null&&num(r.lucro)!=null)respostas[i.chave]={custo:r.custo,lucro:r.lucro,receber:String(Math.round((num(r.custo)+num(r.lucro))*100)/100).replace('.',','),nota:r.nota||undefined};continue}if(SO_REC){if(r&&(num(r.receber)!=null||r.nota))respostas[i.chave]={receber:r.receber,nota:r.nota||undefined};continue}if(r&&(num(r.receber)!=null||r.custo||r.nota||String(r.tecido||'').trim()||temEst(i.chave)||temNv(i.chave)||temSku(i.chave)||r.calT)){const{calT,...x}=r;x.calidad=r.calidad||calSug(i.nome)||undefined;x.nuevas=(r.nuevas||[]).filter(n=>String(n.cor||'').trim()).map(({subindo,erro,...n})=>n);respostas[i.chave]=x}}
  const btn=$('#enviar');btn.disabled=true;btn.textContent=t('enviando');
  try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({acao:'precos_enviar',t:T,respostas,obs:OBS,soEstoque:SO_EST,soSku:SO_SKU})});const d=await r.json();
    if(!d.ok)throw new Error(d.erro||t('erro'));
    try{localStorage.removeItem(CHAVE)}catch(e){}
    $('#barra').style.display='none';
    $('#app').innerHTML=`<div class="fim"><h2>${t('pronto')}</h2><p>${t('recebemos')(d.produtos)}</p><p class="info">${t('mudar')}</p></div>`;
    window.scrollTo(0,0);
  }catch(e){btn.disabled=false;btn.textContent=t('enviar');alert(t('naoEnviou')+e.message)}
};
iniciar();
</script>
</body>
</html>
