<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WhatsApp — Conectando...</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { 
    background: #0a0a09; 
    color: #f3efe4; 
    font-family: 'Montserrat', sans-serif; 
    display: flex; 
    align-items: center; 
    justify-content: center; 
    min-height: 100vh; 
    padding: 20px;
  }
  .container {
    background: #111110;
    border: 1px solid #282722;
    border-radius: 12px;
    padding: 40px;
    max-width: 400px;
    text-align: center;
  }
  .spinner {
    width: 50px;
    height: 50px;
    border: 3px solid #282722;
    border-top-color: #d4a94a;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 20px;
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
  .status-icon {
    font-size: 48px;
    margin-bottom: 16px;
  }
  h2 {
    font-size: 22px;
    margin-bottom: 12px;
    font-family: 'Oswald', sans-serif;
  }
  .message {
    font-size: 14px;
    color: #a39d8c;
    line-height: 1.6;
  }
  .error-box {
    background: #e0525a20;
    border: 1px solid #e0525a;
    color: #e0525a;
    padding: 16px;
    border-radius: 8px;
    margin-top: 20px;
    font-size: 13px;
  }
  .success-box {
    background: #5fbf7a20;
    border: 1px solid #5fbf7a;
    color: #5fbf7a;
    padding: 16px;
    border-radius: 8px;
    margin-top: 20px;
    font-size: 13px;
  }
  a {
    color: #d4a94a;
    text-decoration: none;
  }
  a:hover {
    color: #f0d791;
  }
</style>
</head>
<body>

<div class="container" id="container">
  <div class="spinner" id="spinner"></div>
  <h2>Conectando WhatsApp...</h2>
  <p class="message">Aguarde enquanto processamos sua autorização.</p>
</div>

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

<script>
// Configuração do Firebase (mesma do sistema)
const firebaseConfig = {
  apiKey: "AIzaSyD7kPODN3ZHzM8SuRlB_vdYC276YOzzXPE",
  authDomain: "lb-gestao-clientes.firebaseapp.com",
  projectId: "lb-gestao-clientes",
  storageBucket: "lb-gestao-clientes.firebasestorage.app",
  messagingSenderId: "344033285587",
  appId: "1:344033285587:web:fbdae7d44eaf5bac760b26"
};

const app = firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const auth = firebase.auth();

// Lê os parâmetros da URL que a Meta envia
const urlParams = new URLSearchParams(window.location.search);
const code = urlParams.get('code');
const state = urlParams.get('state');
const error = urlParams.get('error');
const errorDescription = urlParams.get('error_description');

async function processCallback() {
  const container = document.getElementById('container');
  
  // Se veio erro da Meta
  if (error) {
    showError(`Erro da Meta: ${error}`, errorDescription);
    return;
  }
  
  // Se não veio code, algo errado
  if (!code) {
    showError('Código de autorização não recebido', 'Tenta conectar novamente.');
    return;
  }
  
  try {
    // Aguarda autenticação do Firebase
    await new Promise((resolve) => {
      const unsubscribe = auth.onAuthStateChanged((user) => {
        unsubscribe();
        resolve(user);
      });
    });
    
    const user = auth.currentUser;
    if (!user) {
      showError('Usuário não autenticado', 'Volta ao sistema e tenta de novo.');
      return;
    }
    
    // Chama o backend pra trocar o code por um token permanente
    const response = await fetch('https://lb-whatsapp-webhook.vercel.app/api/whatsapp-exchange-token', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        code: code,
        user_id: user.uid
      })
    });
    
    const data = await response.json();
    
    if (!response.ok || !data.ok) {
      showError('Erro ao processar token', data.erro || 'Tenta novamente.');
      return;
    }
    
    // Salva numa configuração ÚNICA e compartilhada da LB (não é por cliente — é 1 conta só)
    await db.collection('configuracoes').doc('whatsapp').set({
      waba_id: data.waba_id,
      phone_number_id: data.phone_number_id,
      phone_number: data.phone_number,
      access_token: data.access_token,
      conectadoPor: user.email,
      conectadoEm: firebase.firestore.FieldValue.serverTimestamp()
    });
    
    // Se deu certo, mostra sucesso e redireciona
    showSuccess('WhatsApp conectado com sucesso!', data.phone_number);
    
    // Aguarda 2 segundos e redireciona de volta pro sistema
    setTimeout(() => {
      window.location.href = window.location.origin + '/?page=marketing#whatsapp-conectado';
    }, 2000);
    
  } catch (e) {
    console.error('Erro:', e);
    showError('Erro na conexão', e.message);
  }
}

function showError(title, message) {
  const container = document.getElementById('container');
  container.innerHTML = `
    <div class="status-icon">❌</div>
    <h2>${title}</h2>
    <div class="error-box">
      ${message || 'Algo deu errado. Tenta conectar novamente.'}
    </div>
    <p class="message" style="margin-top: 20px;">
      <a href="${window.location.origin}">← Voltar ao sistema</a>
    </p>
  `;
}

function showSuccess(title, phoneNumber) {
  const container = document.getElementById('container');
  container.innerHTML = `
    <div class="status-icon">✓</div>
    <h2>${title}</h2>
    <div class="success-box">
      <strong>${phoneNumber}</strong><br>
      <small>Número conectado com sucesso. Redirecionando...</small>
    </div>
  `;
}

// Inicia o processamento quando a página carrega
processCallback();
</script>

</body>
</html>
