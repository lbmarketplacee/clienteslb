<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Escritório LB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Escritório LB — prévia (12/10/2026). Agência de IA: cada robô do sistema vira um funcionário com nome, mesa e status,
   alimentado AO VIVO pelo automacaoLog e pelos dados dos clientes. Fase 1 = visual (sem custo de IA). */
:root{--bg:#0b0a08;--parede:#15130f;--piso1:#1d1a14;--piso2:#191610;--card:#141310;--borda:#2b2822;--gold:#d4a94a;--gold2:#f0d791;--txt:#f3efe4;--dim:#a39d8c;--dim2:#6e6a5d;--verde:#5fbf7a;--verm:#e0525a;--amb:#e0a352}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--txt);font-family:Inter,sans-serif;min-height:100%}
body{display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:14px;padding:14px 22px;border-bottom:1px solid var(--borda)}
.logo{font-family:Oswald;font-size:24px;font-weight:700;color:var(--gold)}.logo small{font-family:Inter;font-size:10px;color:var(--dim);letter-spacing:.3em;display:block;margin-top:-3px}
.selo{font-size:11px;border:1px solid var(--gold);color:var(--gold2);padding:3px 10px;border-radius:99px;letter-spacing:.06em}
.hdr-num{margin-left:auto;display:flex;gap:22px}.hdr-num div{text-align:right}.hdr-num b{font-family:Oswald;font-size:22px;display:block}.hdr-num span{font-size:11px;color:var(--dim)}
main{flex:1;display:grid;grid-template-columns:1fr 360px;height:calc(100vh - 66px)}
#sala{position:relative;overflow:hidden;background:var(--bg);height:100%}
#palco{position:absolute;left:0;top:0;width:1400px;height:860px;transform-origin:0 0}
/* parede do fundo */
.parede{position:absolute;left:0;right:0;top:0;height:230px;background:linear-gradient(#1a1712,#13110d);border-bottom:6px solid #2b2620}
.parede .marca{position:absolute;left:50%;top:44px;transform:translateX(-50%);text-align:center}
.parede .marca h1{font-family:Oswald;font-size:54px;letter-spacing:.06em;color:var(--gold);text-shadow:0 0 30px #d4a94a55}
.parede .marca p{font-size:13px;letter-spacing:.5em;color:var(--dim)}
.janela{position:absolute;top:36px;width:190px;height:130px;border:6px solid #2e2922;border-radius:6px;background:linear-gradient(160deg,#27364a,#141c27 60%,#0f141b);overflow:hidden}
.janela:after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent 48%,#2e2922 48%,#2e2922 52%,transparent 52%)}
.janela i{position:absolute;bottom:0;width:22px;background:#0b0f15;border-top:2px solid #1d2632}
.tv{position:absolute;right:300px;top:40px;width:230px;height:130px;background:#050505;border:5px solid #26221c;border-radius:8px;padding:12px 14px;box-shadow:0 0 40px #d4a94a22}
.tv small{font-size:10px;color:var(--dim);letter-spacing:.2em}.tv b{display:block;font-family:Oswald;font-size:38px;color:var(--gold2);line-height:1.1}.tv span{font-size:11px;color:var(--verde)}
.tv:before{content:'AO VIVO';position:absolute;right:10px;top:10px;font-size:9px;color:var(--verm);letter-spacing:.15em}
/* piso */
.piso{position:absolute;left:0;right:0;top:236px;bottom:0;background:repeating-linear-gradient(90deg,var(--piso1) 0 140px,var(--piso2) 140px 280px)}
.piso:after{content:'';position:absolute;inset:0;background:radial-gradient(800px 380px at 50% 0%,#d4a94a14,transparent 70%)}
.planta{position:absolute;width:56px}
/* mesa de cada funcionário */
.posto{position:absolute;width:210px;cursor:pointer;transition:transform .2s;transform-origin:50% 100%}
.posto:hover{transform:scale(1.04)}
.posto.sel .placa{border-color:var(--gold);box-shadow:0 0 0 2px #d4a94a55}
.balao{position:absolute;left:50%;bottom:calc(100% - 22px);transform:translateX(-50%);width:200px;background:#f6f1e3;color:#1b1914;font-size:11.5px;line-height:1.3;padding:7px 10px;border-radius:12px;box-shadow:0 6px 18px #0008;opacity:0;transition:opacity .4s;pointer-events:none}
.balao:after{content:'';position:absolute;left:50%;bottom:-6px;margin-left:-6px;border:6px solid transparent;border-bottom:0;border-top-color:#f6f1e3}
.posto.fala .balao{opacity:1}
.avatar{display:block;margin:0 auto -10px;width:96px;height:96px;position:relative;z-index:1}
.posto.trabalhando .avatar{animation:digita 1.1s ease-in-out infinite}
@keyframes digita{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.mesa{position:relative;height:74px}
.mesa svg{width:100%;height:100%}
.tela{transition:fill .4s}
.posto.trabalhando .tela{fill:#3c5d8a;animation:pisca 1.6s infinite}
@keyframes pisca{50%{fill:#5a86c4}}
.placa{margin:6px auto 0;width:180px;text-align:center;background:#0f0e0bd9;border:1px solid var(--borda);border-radius:12px;padding:6px 8px}
.placa b{font-family:Oswald;font-size:17px;letter-spacing:.02em}.placa span{display:block;font-size:11px;color:var(--dim)}
.st{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;margin-top:3px;color:var(--dim)}.st i{width:7px;height:7px;border-radius:50%;background:var(--dim2)}
.st.ok i{background:var(--verde);box-shadow:0 0 8px var(--verde)}.st.esp i{background:var(--amb)}.st.prob i{background:var(--verm);box-shadow:0 0 8px var(--verm)}
.contador{position:absolute;right:14px;top:96px;z-index:2;background:var(--gold);color:#16130d;font-family:Oswald;font-weight:700;font-size:13px;min-width:26px;height:26px;border-radius:13px;display:flex;align-items:center;justify-content:center;padding:0 7px;box-shadow:0 3px 10px #0007}
/* mesa de reunião (gerente) */
.reuniao{position:absolute;left:520px;top:640px;width:360px;height:110px;border-radius:55px;background:linear-gradient(#3a3024,#2a231a);border:2px solid #4a3d2d;box-shadow:0 18px 40px #0009}
/* painel lateral */
aside{border-left:1px solid var(--borda);background:var(--card);padding:18px;overflow:auto;max-height:calc(100vh - 66px)}
.perfil{display:flex;gap:12px;align-items:center}.perfil svg{width:74px;height:74px;flex:0 0 auto}
.perfil h2{font-family:Oswald;font-size:26px}.perfil p{font-size:12.5px;color:var(--dim)}
.chefe{font-size:12px;margin-top:4px}.chefe b{color:var(--gold2)}
.bloco{margin-top:16px}.bloco h3{font-size:11px;letter-spacing:.14em;color:var(--dim);margin-bottom:8px;text-transform:uppercase}
.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.nums div{background:#0f0e0b;border:1px solid var(--borda);border-radius:10px;padding:8px}.nums b{font-family:Oswald;font-size:22px;display:block}.nums span{font-size:10.5px;color:var(--dim)}
.lista{display:flex;flex-direction:column;gap:6px}.lista div{font-size:12.5px;background:#0f0e0b;border:1px solid var(--borda);border-radius:10px;padding:8px 10px;line-height:1.35}.lista em{font-style:normal;color:var(--dim);font-size:11px;display:block}
.lista .ruim{border-color:#e0525a55}
.faz{font-size:12.5px;line-height:1.5;color:var(--txt)}.faz li{margin-left:16px}
.breve{border:1px dashed var(--borda);border-radius:12px;padding:12px;font-size:12px;color:var(--dim)}
.breve input{width:100%;margin-top:8px;background:#0f0e0b;border:1px solid var(--borda);border-radius:99px;padding:9px 14px;color:var(--dim);font:inherit}
#login{position:fixed;inset:0;background:var(--bg);display:none;align-items:center;justify-content:center;flex-direction:column;gap:16px;z-index:9}
#login button{background:var(--gold);color:#16130d;border:0;border-radius:99px;padding:12px 26px;font-weight:700;font-size:15px;cursor:pointer}
@media(max-width:900px){main{grid-template-columns:1fr;height:auto}#sala{height:62vw;min-height:300px}aside{border-left:0;border-top:1px solid var(--borda);max-height:none}.hdr-num{display:none}}
</style>
</head>
<body>
<header>
  <div class="logo">LB<small>MARKETPLACE</small></div>
  <div><b style="font-family:Oswald;font-size:20px">Escritório LB</b> <span class="selo">PRÉVIA · AGÊNCIA DE IA</span></div>
  <div class="hdr-num"><div><b id="hTrab">—</b><span>trabalhos hoje</span></div><div><b id="hSemana">—</b><span>nos últimos 7 dias</span></div><div><b id="hProb" style="color:var(--verm)">—</b><span>problemas hoje</span></div></div>
</header>
<main>
  <div id="sala"><div id="palco">
    <div class="parede">
      <div class="janela" style="left:70px"><i style="left:20px;height:50px"></i><i style="left:60px;height:80px"></i><i style="left:110px;height:40px"></i><i style="left:150px;height:65px"></i></div>
      <div class="marca"><h1>LB MARKETPLACE</h1><p>AGÊNCIA DE IA</p></div>
      <div class="tv"><small>TRABALHOS HOJE</small><b id="tvNum">—</b><span id="tvTxt">carregando…</span></div>
      <div class="janela" style="right:70px"><i style="left:30px;height:70px"></i><i style="left:80px;height:45px"></i><i style="left:130px;height:85px"></i></div>
    </div>
    <div class="piso"></div>
    <div class="reuniao"></div>
    <div id="postos"></div>
  </div></div>
  <aside id="painel"></aside>
</main>
<div id="login"><div class="logo" style="font-size:40px">LB<small>MARKETPLACE</small></div><p style="color:var(--dim)">Entre com a conta Google da equipe</p><button id="btnLogin">Entrar com Google</button></div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import{getAuth,onAuthStateChanged,GoogleAuthProvider,signInWithPopup}from"https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
import{getFirestore,collection,query,orderBy,limit,where,onSnapshot,getDocs}from"https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyD7kPODN3ZHzM8SuRlB_vdYC276YOzzXPE",authDomain:"lb-gestao-clientes.firebaseapp.com",projectId:"lb-gestao-clientes",storageBucket:"lb-gestao-clientes.firebasestorage.app",messagingSenderId:"344033285587",appId:"1:344033285587:web:fbdae7d44eaf5bac760b26"};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ms=v=>v?.toMillis?v.toMillis():v instanceof Date?v.getTime():Number(v)||0;
const hojeBRT=()=>new Date(Date.now()-3*3600000).toISOString().slice(0,10);
const inicioHoje=()=>+new Date(hojeBRT()+'T00:00:00-03:00');
const hora=t=>{const d=new Date(t);return (d.toISOString().slice(0,10)===new Date().toISOString().slice(0,10)?'':d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})+' ')+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});};
const MP={shopee:'Shopee',tiktok:'TikTok',ml:'Mercado Livre',shein:'SHEIN',comercial:'Comercial',financeiro:'Financeiro',produtos:'Produtos'};

// ===== A equipe de IA (nomes sugeridos — o Lincoln pode trocar) =====
// tipos = combinações marketplace:tipo do automacaoLog que são trabalho desse funcionário
const AGENTES=[
  {id:'lia',nome:'Lia',cargo:'Promoções',cor:'#e0a352',acess:'estrela',chefe:'Carol',x:110,y:290,
   tipos:[/oferta_relampago/,/campanha_ml/,/desconto_fixo/,/cupom_fixo/,/promo_giro/],
   faz:['Ofertas relâmpago na Shopee, TikTok e Mercado Livre','Entra nas campanhas do ML (10.10, 11.11…)','Renova desconto fixo e cupom antes de vencer','Promo de giro nos produtos parados']},
  {id:'teo',nome:'Téo',cargo:'Tráfego pago',cor:'#4d8ef0',acess:'fone',chefe:'Carol',x:440,y:290,
   tipos:[/^shopee:ads$/,/impulsionar/,/alerta_ads/],
   faz:['Coloca todo produto novo no Ads (ROAS 20)','Impulsiona os mais vendidos a cada 4h','Avisa o cliente quando o saldo do Ads zera']},
  {id:'nina',nome:'Nina',cargo:'Catálogo e anúncios',cor:'#a46bf0',acess:'lapis',chefe:'Nova pessoa',x:770,y:290,
   tipos:[/pedido_produto/,/^shein:produto/,/produto/],
   faz:['Recebe os produtos que a cliente manda pelo link','Cria e copia anúncios entre Shopee, ML, TikTok e SHEIN','Padroniza títulos, marca, preço e fotos']},
  {id:'davi',nome:'Davi',cargo:'Saúde das lojas',cor:'#4dd6a0',acess:'cruz',chefe:'Carol',x:1100,y:290,
   tipos:[/saude/],
   faz:['Lê a saúde de cada loja 4x por dia','Acha pedido atrasado antes da penalidade','Abre tarefa quando a conexão de uma loja cai']},
  {id:'iris',nome:'Íris',cargo:'Relatórios e BI',cor:'#f06bb0',acess:'oculos',chefe:'Lincoln',x:60,y:520,
   tipos:[/relatorio/,/resumo/],
   faz:['Resumo diário no WhatsApp às 8h','Relatório mensal de cada cliente','Relatório das datas comemorativas (10.10, Black Friday…)','Curva ABC dos produtos']},
  {id:'leo',nome:'Léo',cargo:'Comercial (SDR)',cor:'#25d366',acess:'fone',chefe:'Guilherme',x:330,y:520,
   tipos:[/^comercial:/],
   faz:['Responde o lead que entra no CRM','Manda o link da agenda','Lembra o lead até ele marcar a reunião']},
  {id:'mel',nome:'Mel',cargo:'Marketing e criativos',cor:'#ff7a59',acess:'estrela',chefe:'Mirela',x:870,y:520,
   tipos:[/criativo/,/marketing/],
   faz:['Fotos de produto com IA (Central Criativa)','Vídeos de produto com IA','Títulos e descrições que vendem']},
  {id:'otto',nome:'Otto',cargo:'Financeiro',cor:'#d4a94a',acess:'oculos',chefe:'Lincoln',x:1140,y:520,
   tipos:[/^financeiro:/],
   faz:['Lê o caixa da Shopee de cada loja','Alerta queda forte de receita do cliente','Avisa mensalidade vencendo pelo WhatsApp da LB']},
  {id:'max',nome:'Max',cargo:'Gerente da equipe',cor:'#f0d791',acess:'gravata',chefe:'Lincoln',x:595,y:560,gerente:true,tipos:[],
   faz:['Acompanha o trabalho de todo mundo','Transforma problema em tarefa pra equipe humana','(fase 3) Briefing da manhã e distribuição do dia']},
];

// ===== desenho do funcionário (robô LB com cor e acessório próprios) =====
function avatarSVG(a,tam=96){
  const c=a.cor;
  const acc={
    estrela:`<path d="M48 4l3 7 7 .6-5.4 4.6 1.7 7L48 19.6 41.7 23.2l1.7-7L38 11.6l7-.6z" fill="${c}"/>`,
    fone:`<path d="M22 46a26 26 0 0 1 52 0" fill="none" stroke="#1d1a14" stroke-width="5"/><rect x="16" y="42" width="10" height="16" rx="4" fill="${c}"/><rect x="70" y="42" width="10" height="16" rx="4" fill="${c}"/><path d="M75 58q0 12-14 13" fill="none" stroke="#1d1a14" stroke-width="3"/>`,
    lapis:`<rect x="70" y="6" width="7" height="26" rx="2" transform="rotate(25 73 19)" fill="${c}"/>`,
    cruz:`<rect x="44" y="6" width="8" height="20" rx="2" fill="${c}"/><rect x="38" y="12" width="20" height="8" rx="2" fill="${c}"/>`,
    oculos:`<circle cx="38" cy="50" r="9" fill="none" stroke="#1d1a14" stroke-width="3"/><circle cx="58" cy="50" r="9" fill="none" stroke="#1d1a14" stroke-width="3"/><path d="M47 50h2" stroke="#1d1a14" stroke-width="3"/>`,
    gravata:`<path d="M48 84l-6 8 6 4 6-4z" fill="${c}"/>`,
  }[a.acess]||'';
  return `<svg class="avatar" viewBox="0 0 96 96" width="${tam}" height="${tam}">
    <ellipse cx="48" cy="92" rx="24" ry="4" fill="#0006"/>
    <path d="M24 96c0-14 10-22 24-22s24 8 24 22z" fill="${c}"/><path d="M38 76h20v6H38z" fill="#0003"/>
    <line x1="48" y1="20" x2="48" y2="28" stroke="#cfc8b6" stroke-width="3"/><circle cx="48" cy="18" r="4" fill="${c}"/>
    <rect x="22" y="28" width="52" height="44" rx="16" fill="#efe9da"/><rect x="28" y="36" width="40" height="28" rx="11" fill="#1d1a14"/>
    <circle cx="39" cy="50" r="4.5" fill="${c}"><animate attributeName="r" values="4.5;4.5;.6;4.5" keyTimes="0;.92;.96;1" dur="${3+Math.random()*2}s" repeatCount="indefinite"/></circle>
    <circle cx="57" cy="50" r="4.5" fill="${c}"><animate attributeName="r" values="4.5;4.5;.6;4.5" keyTimes="0;.92;.96;1" dur="${3+Math.random()*2}s" repeatCount="indefinite"/></circle>
    <path d="M42 58q6 4 12 0" fill="none" stroke="${c}" stroke-width="2.5" stroke-linecap="round"/>
    ${acc}</svg>`;
}
const MESA=`<svg viewBox="0 0 210 74" preserveAspectRatio="none"><rect x="128" y="0" width="60" height="38" rx="4" fill="#0c0c0c" stroke="#3a352c" stroke-width="2"/><rect class="tela" x="132" y="4" width="52" height="30" rx="2" fill="#1b2433"/><rect x="154" y="38" width="8" height="8" fill="#3a352c"/>
  <rect x="0" y="44" width="210" height="14" rx="4" fill="#5a4630"/><rect x="0" y="54" width="210" height="6" fill="#3b2e20"/><rect x="12" y="58" width="10" height="16" fill="#2d241a"/><rect x="188" y="58" width="10" height="16" fill="#2d241a"/>
  <rect x="40" y="38" width="46" height="7" rx="2" fill="#2a2620"/><rect x="96" y="36" width="14" height="9" rx="2" fill="#e8e1d0"/></svg>`;

// ===== estado =====
let logs=[],sel=null,extra={saude:{},crm:{},ia:{},tarefas:{},resumo:null};
const agenteDe=l=>{const k=`${l.marketplace||''}:${l.tipo||l.acao||''}`;return AGENTES.find(a=>a.tipos.some(r=>r.test(k)));};
function fala(l){
  const n=l.cliente||'';const d=l.detalhes||{};const k=`${l.marketplace}:${l.tipo||l.acao}`;
  const ruim=l.resultado==='falhou'||l.resultado==='erro';
  if(/oferta_relampago/.test(k))return ruim?`Não consegui a relâmpago da ${n} (${MP[l.marketplace]||''})${l.motivo?': '+l.motivo:''}`:`Relâmpago criada na ${n} (${MP[l.marketplace]||''})`;
  if(/campanha_ml/.test(k))return `Coloquei produtos da ${n} na campanha do ML`;
  if(/desconto_fixo/.test(k))return ruim?`Desconto fixo da ${n} precisa de atenção`:`Renovei o desconto fixo da ${n}`;
  if(/cupom_fixo/.test(k))return ruim?`Cupom da ${n} não renovou${l.motivo?': '+l.motivo:''}`:`Renovei o cupom da ${n}`;
  if(/promo_giro/.test(k))return `Promo de giro na ${n}`;
  if(/impulsionar/.test(k))return `Impulsionei ${(d.itens||[]).length||''} produto(s) da ${n}`;
  if(/^shopee:ads/.test(k))return `${d.criados||''} produto(s) novos da ${n} no Ads`;
  if(/alerta_ads/.test(k))return `Avisei a ${n}: saldo do Ads zerado`;
  if(/pedido_produto/.test(k))return `${n} mandou produto novo pelo link`;
  if(/shein:produto/.test(k))return ruim?`Produto da ${n} não subiu na SHEIN`:`Subi produto da ${n} na SHEIN`;
  if(/^comercial:/.test(k))return `Lembrei ${n||'um lead'} de marcar a reunião`;
  if(/^financeiro:/.test(k))return `Aviso de mensalidade pra ${n}`;
  return `${l.acao||l.tipo} · ${n}`;
}
function statusDe(a){
  const meus=logs.filter(l=>l._ag===a);const hoje=meus.filter(l=>l._t>=inicioHoje());
  const prob=hoje.filter(l=>l.resultado==='falhou'||l.resultado==='erro').length;
  const recente=meus[0]&&Date.now()-meus[0]._t<45*60000;
  if(a.id==='davi'){const s=extra.saude;return{hoje:s.lojas||0,prob:s.atrasados?1:0,txt:s.atrasados?`${s.lojasAtraso} lojas com pedido atrasado`:'Lojas em dia',cls:s.atrasados?'prob':'ok',trab:true};}
  if(a.id==='mel'){const i=extra.ia;return{hoje:i.fotos+i.videos+i.textos||0,prob:0,txt:i.fotos||i.videos?`${i.fotos} fotos e ${i.videos} vídeos hoje`:'Esperando pedido de criativo',cls:i.fotos||i.videos?'ok':'',trab:!!(i.fotos||i.videos)};}
  if(a.id==='iris'){return{hoje:extra.resumo?1:0,prob:0,txt:extra.resumo?'Resumo do dia enviado':'Prepara o resumo às 8h',cls:extra.resumo?'ok':'',trab:false};}
  if(a.id==='max'){const t=extra.tarefas;return{hoje:t.abertasAuto||0,prob:t.atrasadas||0,txt:`${t.abertasAuto||0} tarefas abertas pela equipe de IA`,cls:t.atrasadas?'esp':'ok',trab:true};}
  return{hoje:hoje.length,prob,txt:meus[0]?fala(meus[0]):'Sem trabalho registrado ainda',cls:prob?'prob':recente?'ok':hoje.length?'ok':'',trab:recente};
}

function desenhar(){
  let total=0,probs=0;
  $('postos').innerHTML=AGENTES.map(a=>{
    const s=statusDe(a);if(!['davi','mel','iris','max'].includes(a.id)){total+=s.hoje;probs+=s.prob;}
    const st=s.cls==='prob'?'Precisa de atenção':s.cls==='esp'?'Esperando a equipe':s.trab?'Trabalhando':s.cls==='ok'?'Em dia':'Parado';
    const esc2=a.gerente?0.92:a.y>400?1.04:0.94;
    return `<div class="posto ${s.trab?'trabalhando':''} ${sel===a.id?'sel':''}" data-id="${a.id}" style="left:${a.x}px;top:${a.y}px;transform:scale(${esc2})">
      <div class="balao">${esc(s.txt)}</div>
      ${s.hoje?`<div class="contador">${s.hoje}</div>`:''}
      ${avatarSVG(a)}${a.gerente?'':`<div class="mesa">${MESA}</div>`}
      <div class="placa"><b>${a.nome}</b><span>${a.cargo}</span><div class="st ${s.cls}"><i></i>${st}</div></div></div>`;
  }).join('');
  document.querySelectorAll('.posto').forEach(p=>p.onclick=()=>{sel=p.dataset.id;desenhar();painel();});
  const semana=logs.filter(l=>l._ag).length;
  $('hTrab').textContent=total;$('hSemana').textContent=semana;$('hProb').textContent=probs;
  $('tvNum').textContent=total;$('tvTxt').textContent=logs[0]?`último: ${hora(logs[0]._t)}`:'';
}
// balões aparecem um de cada vez, como se estivessem falando
let falaI=0;setInterval(()=>{const ps=[...document.querySelectorAll('.posto')];ps.forEach(p=>p.classList.remove('fala'));if(ps.length){ps[falaI%ps.length].classList.add('fala');falaI++;}},3500);

function painel(){
  const a=AGENTES.find(x=>x.id===sel)||AGENTES.find(x=>x.gerente);
  const s=statusDe(a);const meus=logs.filter(l=>l._ag===a).slice(0,12);
  const semana=logs.filter(l=>l._ag===a).length;
  let extraHtml='';
  if(a.id==='davi'){const sd=extra.saude;extraHtml=`<div class="lista">${(sd.piores||[]).map(x=>`<div class="${x.atrasados?'ruim':''}">${esc(x.nome)}<em>${x.atrasados?x.atrasados+' pedidos atrasados':''}${x.fora?` · ${x.fora} métrica(s) fora da meta`:''}</em></div>`).join('')||'<div>Nenhuma loja com problema</div>'}</div>`;}
  if(a.id==='leo'){const c=extra.crm;extraHtml=`<div class="nums"><div><b>${c.novos||0}</b><span>leads na semana</span></div><div><b>${c.agendados||0}</b><span>agendados</span></div><div><b>${c.total||0}</b><span>no CRM</span></div></div>`;}
  if(a.id==='max'){const t=extra.tarefas;extraHtml=`<div class="lista">${Object.entries(t.porPessoa||{}).map(([p,n])=>`<div>${esc(p)}<em>${n} tarefa(s) abertas criadas pela IA</em></div>`).join('')||'<div>Nenhuma tarefa aberta</div>'}</div>`;}
  $('painel').innerHTML=`<div class="perfil">${avatarSVG(a,74).replace('class="avatar"','')}<div><h2>${a.nome}</h2><p>${a.cargo}</p><div class="chefe">Supervisão: <b>${a.chefe}</b></div></div></div>
    <div class="bloco"><div class="nums"><div><b>${s.hoje}</b><span>hoje</span></div><div><b>${a.tipos.length?semana:'—'}</b><span>7 dias</span></div><div><b style="color:${s.prob?'var(--verm)':'inherit'}">${s.prob}</b><span>${a.gerente?'atrasadas':'problemas'}</span></div></div></div>
    <div class="bloco"><h3>O que eu faço</h3><ul class="faz">${a.faz.map(f=>`<li>${esc(f)}</li>`).join('')}</ul></div>
    ${extraHtml?`<div class="bloco"><h3>${a.id==='davi'?'Lojas que precisam de atenção':a.id==='leo'?'Comercial':'Tarefas pra equipe humana'}</h3>${extraHtml}</div>`:''}
    ${meus.length?`<div class="bloco"><h3>Últimos trabalhos</h3><div class="lista">${meus.map(l=>`<div class="${l.resultado==='falhou'||l.resultado==='erro'?'ruim':''}">${esc(fala(l))}<em>${hora(l._t)}</em></div>`).join('')}</div></div>`:''}
    <div class="bloco"><h3>Esperando sua aprovação</h3><div class="breve">Fase 2: aqui ${a.nome} vai mostrar o que quer fazer (ex.: "colocar 6 produtos parados da SS Tendência com −15%") e você aprova com um clique.</div></div>
    <div class="bloco"><h3>Conversar com ${a.nome}</h3><div class="breve">Fase 3: chat com ${a.nome}, que responde lendo os dados reais das lojas.<input disabled placeholder="Ex.: ${a.nome}, como foi a Primor no 10.10?"></div></div>`;
}

// ===== dados =====
function ouvir(){
  onSnapshot(query(collection(db,'automacaoLog'),where('quando','>=',new Date(Date.now()-7*86400000)),orderBy('quando','desc'),limit(1500)),snap=>{
    logs=snap.docs.map(d=>{const l=d.data();l._t=ms(l.quando);l._ag=agenteDe(l);return l;});
    desenhar();painel();
  });
}
async function carregarExtras(){
  const hoje=hojeBRT();
  const [cs,ts,ls,ia,rs]=await Promise.all([getDocs(collection(db,'clientes')),getDocs(collection(db,'tarefas')),getDocs(collection(db,'crmLeads')),getDocs(query(collection(db,'iaUso'),where('dia','==',hoje))),getDocs(query(collection(db,'resumos'),orderBy('criadoEm','desc'),limit(1)))]);
  const clientes=cs.docs.map(d=>d.data()).filter(c=>c.ativo!==false);
  const piores=clientes.filter(c=>c.saudeShopee).map(c=>({nome:c.nome,atrasados:c.saudeShopee.pedidos?.atrasados||0,fora:(c.saudeShopee.foraDaMeta||[]).length})).filter(x=>x.atrasados||x.fora).sort((a,b)=>b.atrasados-a.atrasados||b.fora-a.fora);
  extra.saude={lojas:clientes.filter(c=>c.saudeShopee).length,atrasados:piores.reduce((t,x)=>t+x.atrasados,0),lojasAtraso:piores.filter(x=>x.atrasados).length,piores:piores.slice(0,8)};
  const tarefas=ts.docs.map(d=>d.data());const ab=tarefas.filter(t=>t.auto&&t.coluna!=='feito');const porPessoa={};ab.forEach(t=>porPessoa[t.responsavel||'—']=(porPessoa[t.responsavel||'—']||0)+1);
  extra.tarefas={abertasAuto:ab.length,atrasadas:ab.filter(t=>t.prazo&&t.prazo<hoje).length,porPessoa};
  const leads=ls.docs.map(d=>d.data());const semana=new Date(Date.now()-7*86400000-3*3600000).toISOString().slice(0,10);
  extra.crm={total:leads.length,novos:leads.filter(l=>(l.createdDate||'')>=semana).length,agendados:leads.filter(l=>l.stage==='agendado').length};
  extra.ia={fotos:0,videos:0,textos:0};ia.docs.forEach(d=>{const x=d.data();extra.ia.fotos+=x.fotos||0;extra.ia.videos+=x.videos||0;extra.ia.textos+=x.textos||0;});
  const r=rs.docs[0]?.data();extra.resumo=r&&new Date(ms(r.criadoEm)-3*3600000).toISOString().slice(0,10)===hoje?r:null;
  desenhar();painel();
}

// escala o escritório pra caber na área
function escala(){const s=$('sala');const k=Math.min(s.clientWidth/1400,(s.clientHeight||860)/860);const p=$('palco');p.style.transform=`scale(${k})`;p.style.left=((s.clientWidth-1400*k)/2)+'px';p.style.top=Math.max(0,((s.clientHeight||860)-860*k)/2)+'px';}
addEventListener('resize',escala);new ResizeObserver(escala).observe($('sala'));

onAuthStateChanged(auth,u=>{
  if(!u){$('login').style.display='flex';return;}
  $('login').style.display='none';escala();desenhar();painel();ouvir();carregarExtras().catch(console.error);setInterval(()=>carregarExtras().catch(console.error),5*60000);
});
$('btnLogin').onclick=()=>signInWithPopup(auth,new GoogleAuthProvider()).catch(e=>alert(e.message));
</script>
