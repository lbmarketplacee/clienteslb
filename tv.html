<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LB Marketplace — Modo TV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Modo TV (07/10/2026): tela da TV do escritório. 1920×1080 escalado pra caber em qualquer tela. Sem dados financeiros sensíveis. */
:root{--bg:#0a0a09;--card:#131210;--card2:#1a1915;--borda:#2a2823;--gold:#d4a94a;--gold2:#f0d791;--gold3:#a8863c;--txt:#f3efe4;--dim:#a39d8c;--dim2:#6e6a5d;--verde:#5fbf7a;--verm:#e0525a;--amb:#e0a352;--azul:#60a5fa;--roxo:#a855f7;--shopee:#ee4d2d;--tiktok:#25f4ee;--ml:#ffe600}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:var(--bg);overflow:hidden;color:var(--txt);font-family:Inter,sans-serif}
#palco{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;background:radial-gradient(1200px 700px at 70% 30%,#1b1710 0%,var(--bg) 60%)}
.topo{position:absolute;left:0;right:0;top:0;height:110px;display:flex;align-items:center;gap:26px;padding:0 56px;border-bottom:1px solid var(--borda)}
.logo{font-family:Oswald;font-size:46px;font-weight:700;color:var(--gold);letter-spacing:.02em}
.logo small{display:block;font-family:Inter;font-size:13px;color:var(--dim);letter-spacing:.35em;font-weight:600;margin-top:-6px}
.cena-tit{font-family:Oswald;font-size:40px;font-weight:600;letter-spacing:.02em}
.cena-tit span{color:var(--gold)}
.relogio{margin-left:auto;text-align:right;font-family:Oswald;font-size:48px;font-weight:600}
.relogio small{display:block;font-family:Inter;font-size:16px;color:var(--dim);font-weight:500}
.pontos{display:flex;gap:10px;margin-left:30px}.pontos i{width:14px;height:14px;border-radius:50%;background:var(--borda);transition:.3s}.pontos i.on{background:var(--gold);width:40px;border-radius:8px}
.cena{position:absolute;left:56px;right:56px;top:140px;bottom:120px;opacity:0;visibility:hidden;transform:translateY(18px);transition:opacity .7s,transform .7s,visibility 0s .7s;pointer-events:none}
.cena.on{opacity:1;visibility:visible;transform:none;transition:opacity .7s,transform .7s,visibility 0s 0s}
.rodape{position:absolute;left:0;right:0;bottom:0;height:90px;border-top:1px solid var(--borda);display:flex;align-items:center;overflow:hidden;background:#0d0c0a}
.rodape b{position:relative;z-index:2;background:#0d0c0a;flex:0 0 auto;padding:0 28px;font-family:Oswald;font-size:24px;color:var(--gold);border-right:1px solid var(--borda);height:100%;display:flex;align-items:center;gap:10px}
.ticker{display:flex;gap:70px;white-space:nowrap;font-size:23px;color:var(--dim);animation:rolar 70s linear infinite;padding-left:40px}
.ticker span em{font-style:normal;color:var(--txt);font-weight:600}
@keyframes rolar{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.card{background:var(--card);border:1px solid var(--borda);border-radius:24px;padding:30px}
.big{font-family:Oswald;font-weight:700;letter-spacing:.01em}
.rot{font-size:20px;color:var(--dim);text-transform:uppercase;letter-spacing:.12em;font-weight:600}
/* ===== Cena 1: Robô LB ===== */
#robo-area{position:absolute;left:0;top:0;width:820px;height:100%}
#robo{position:absolute;left:40px;bottom:30px;width:520px}
#robo .braco-d{transform-origin:358px 300px;animation:trabalha 1.4s ease-in-out infinite}
#robo .braco-e{transform-origin:162px 300px;animation:trabalha2 1.4s ease-in-out infinite}
#robo .olho{animation:pisca 4s infinite}
#robo .antena{transform-origin:260px 70px;animation:balanca 2.2s ease-in-out infinite}
#robo.festa .corpo{animation:pula .5s ease-in-out 3}
@keyframes trabalha{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(22deg)}}
@keyframes trabalha2{0%,100%{transform:rotate(6deg)}50%{transform:rotate(-14deg)}}
@keyframes pisca{0%,46%,50%,100%{transform:scaleY(1)}48%{transform:scaleY(.1)}}
@keyframes balanca{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
@keyframes pula{0%,100%{transform:translateY(0)}50%{transform:translateY(-26px)}}
.fala{position:absolute;left:470px;top:40px;width:360px;background:var(--card2);border:2px solid var(--gold);border-radius:24px;padding:22px 26px;font-size:24px;line-height:1.35;font-weight:600}
.fala:after{content:'';position:absolute;left:-18px;bottom:40px;border:16px solid transparent;border-right-color:var(--gold)}
.fala small{display:block;color:var(--gold);font-size:17px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px}
#bancada{position:absolute;left:860px;top:0;width:520px;height:620px}
.peca{position:absolute;left:20px;top:40px;width:480px;border-radius:26px;background:var(--card2);border:2px solid var(--borda);padding:30px;opacity:0;transform:scale(.6) translateX(-200px) rotate(-8deg)}
.peca.montando{animation:monta 1.6s cubic-bezier(.2,.9,.3,1.2) forwards}
.peca.pronta{opacity:1;transform:none;border-color:var(--gold);box-shadow:0 0 60px rgba(212,169,74,.25)}
@keyframes monta{0%{opacity:0;transform:scale(.6) translateX(-260px) rotate(-10deg)}60%{opacity:1;transform:scale(1.04) translateX(10px) rotate(2deg)}100%{opacity:1;transform:none}}
.peca .ico{width:84px;height:84px;border-radius:22px;display:flex;align-items:center;justify-content:center;font-size:46px;margin-bottom:18px}
.peca h4{font-family:Oswald;font-size:40px;font-weight:600;line-height:1.1}
.peca p{font-size:24px;color:var(--dim);margin-top:10px;line-height:1.35}
.peca .num{font-family:Oswald;font-size:76px;color:var(--gold);margin-top:8px;line-height:1}
.carimbo{position:absolute;right:24px;top:28px;border:4px solid var(--verde);color:var(--verde);font-family:Oswald;font-size:30px;padding:4px 16px;border-radius:10px;transform:rotate(-12deg) scale(2);opacity:0}
.peca.pronta .carimbo{animation:carimba .45s .2s forwards}
@keyframes carimba{to{opacity:1;transform:rotate(-12deg) scale(1)}}
.barras{display:flex;gap:12px;align-items:flex-end;height:120px;margin-top:16px}.barras i{flex:1;background:linear-gradient(var(--gold2),var(--gold3));border-radius:8px 8px 0 0;height:10%;transition:height 1s}
.balao{margin-top:16px;background:#1f2c22;border-radius:18px 18px 18px 4px;padding:16px 20px;font-size:22px;color:#cfe9d6;opacity:0;transform:translateY(20px);transition:.6s}
.peca.pronta .balao{opacity:1;transform:none}
#contadores{position:absolute;right:0;top:0;width:420px;display:grid;gap:18px}
#contadores .card{padding:22px 26px}
#contadores .big{font-size:64px;color:var(--gold);line-height:1}
#feed{position:absolute;left:860px;right:440px;bottom:0;height:150px;display:flex;flex-direction:column;gap:10px;overflow:hidden}
#feed div{font-size:21px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#feed div em{font-style:normal;color:var(--txt)}
/* ===== Outras cenas ===== */
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:28px}
.mp{display:flex;align-items:center;gap:14px;font-size:28px;font-weight:600}.mp i{width:20px;height:20px;border-radius:6px;display:inline-block}
.ranking{display:grid;grid-template-columns:1fr 1fr;gap:14px 40px;margin-top:28px}
.ranking div{display:flex;align-items:center;gap:18px;font-size:27px;padding:14px 22px;background:var(--card);border:1px solid var(--borda);border-radius:16px}
.ranking b{font-family:Oswald;color:var(--gold);width:44px}.ranking span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ranking em{font-style:normal;font-family:Oswald;font-size:30px}
.equipe{display:grid;grid-template-columns:repeat(4,1fr);gap:28px}
.pessoa{text-align:center;padding:40px 24px}
.pessoa img,.pessoa .av{width:170px;height:170px;border-radius:50%;object-fit:cover;border:5px solid var(--gold);margin:0 auto 22px;display:block}
.pessoa .av{display:flex;align-items:center;justify-content:center;font-family:Oswald;font-size:80px;background:var(--card2)}
.pessoa h3{font-family:Oswald;font-size:44px;font-weight:600}
.pessoa .linha{display:flex;justify-content:space-between;font-size:26px;margin-top:14px;padding:12px 18px;border-radius:12px;background:var(--card2)}
.alertas{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
.alerta h3{font-family:Oswald;font-size:34px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
.alerta h3 b{font-size:60px;color:var(--verm)}
.alerta p{font-size:22px;color:var(--dim);margin-top:12px;line-height:1.45;max-height:225px;overflow:hidden}
.funil{display:flex;gap:22px;margin-top:10px}
.etapa{flex:1;text-align:center;padding:30px 10px;border-radius:22px;background:var(--card);border:1px solid var(--borda)}
.etapa .big{font-size:88px;line-height:1}.etapa .rot{margin-top:8px}
#login{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:28px;background:var(--bg);z-index:9}
#login button{font-size:28px;padding:20px 44px;border-radius:16px;border:0;background:var(--gold);color:#181712;font-weight:700;cursor:pointer}
</style>
</head>

<div id="palco">
  <div class="topo">
    <div class="logo">LB<small>MARKETPLACE</small></div>

  <!-- 1. Robô LB trabalhando (eventos reais do automacaoLog) -->

          <circle cx="210" cy="420" r="10" fill="#151410"/><circle cx="260" cy="420" r="10" fill="#151410"/><circle cx="310" cy="420" r="10" fill="#151410"/>

          <g class="braco-d"><rect x="358" y="290" width="70" height="34" rx="17" fill="url(#ouro)"/><rect x="416" y="300" width="44" height="120" rx="22" fill="url(#ouro)" transform="rotate(-10 438 300)"/><circle cx="450" cy="428" r="24" fill="#a8863c"/></g>
          <rect x="180" y="470" width="56" height="70" rx="20" fill="#a8863c"/><rect x="284" y="470" width="56" height="70" rx="20" fill="#a8863c"/>
        </g>
      </svg>
    </div>
    <div id="bancada"><div class="peca" id="peca"></div></div>
    <div id="contadores"></div>
    <div id="feed"></div>
  </section>

  <!-- 2. Resultado do mês -->
  <section class="cena" data-tit="Vendas do mês dos <span>clientes</span>"><div id="cenaGmv"></div></section>
  <!-- 3. Tarefas da equipe -->
  <section class="cena" data-tit="Placar da <span>equipe</span>"><div id="cenaEquipe"></div></section>
  <!-- 4. Precisa de ação -->
  <section class="cena" data-tit="Precisa de <span>ação</span> hoje"><div id="cenaAcao"></div></section>
  <!-- 5. Comercial -->
  <section class="cena" data-tit="<span>Comercial</span> — leads e reuniões"><div id="cenaComercial"></div></section>

  <div class="rodape"><b>● AO VIVO</b><div class="ticker" id="ticker"></div></div>
  <div id="login"><div class="logo" style="font-size:80px">LB<small>MODO TV</small></div><button id="btnLogin">Entrar com o Google</button><div style="color:#a39d8c;font-size:20px">Use a mesma conta do sistema</div></div>
</div>

function animar(ev,quando,aoVivo){
  const p=$('peca');p.className='peca';void p.offsetWidth;
  p.style.borderColor='';p.innerHTML=`<div class="ico" style="background:${ev.cor}22;color:${ev.cor}">${ev.ico}</div><h4>${esc(ev.tit)}</h4><p>${esc(ev.txt)}</p><div class="num">${esc(ev.num)}</div>${ev.extra?`<p>${esc(ev.extra)}</p>`:''}${ev.tipo==='ads'?'<div class="barras"><i></i><i></i><i></i><i></i><i></i><i></i></div>':''}${ev.balao?`<div class="balao">${esc(ev.balao)}</div>`:''}<div class="carimbo">FEITO ✓</div>`;
  p.classList.add('montando');setTimeout(()=>{p.classList.remove('montando');p.classList.add('pronta');p.querySelectorAll('.barras i').forEach((b,k)=>setTimeout(()=>b.style.height=(30+Math.random()*70)+'%',k*120));},1600);
  $('falaTxt').textContent=ev.fala;$('falaHora').textContent=aoVivo?'agora mesmo':`hoje às ${hora(quando)}`;
  if(aoVivo){const r=$('robo');r.classList.remove('festa');void r.getBBox();r.classList.add('festa');}
}
function proximo(){
  if(atual!==0)return;
  const ev=fila.shift();if(ev){animar(ev.ev,ev.quando,true);return;}
  const hist=eventos.filter(e=>e.ev);if(!hist.length){$('falaTxt').textContent='Tudo em dia por aqui. Fico de olho nas lojas 24h.';return;}
  const e=hist[idxReplay++%Math.min(hist.length,25)];animar(e.ev,e.quando,false);
}
setInterval(proximo,6500);

function contadores(){
  const hoje=+inicioDia();const h=eventos.filter(e=>e.quando>=hoje&&e.ev);
  const c=t=>h.filter(e=>e.ev.tipo===t).length;
  const rel=h.filter(e=>e.ev.tipo==='relampago').reduce((t,e)=>t+(parseInt(e.ev.num)||1),0);
  $('contadores').innerHTML=[['Ofertas relâmpago hoje',rel,'#e0a352'],['Produtos em promoções do ML',h.filter(e=>e.ev.tipo==='campanha').reduce((t,e)=>t+(parseInt(e.ev.num)||0),0),'#ffe600'],['Lembretes de agenda',c('whats'),'#25d366'],['Cupons e descontos renovados',c('cupom'),'#a855f7']]
    .map(([r,n,cor])=>`<div class="card"><div class="rot">${r}</div><div class="big" style="color:${cor}">${n}</div></div>`).join('');
  $('feed').innerHTML=eventos.filter(e=>e.ev).slice(0,4).map(e=>`<div>${hora(e.quando)} · <em>${esc(e.ev.fala)}</em></div>`).join('');
  const tick=eventos.filter(e=>e.ev).slice(0,12).map(e=>`<span>${hora(e.quando)} · <em>${esc(e.ev.fala)}</em></span>`).join('');$('ticker').innerHTML=tick+tick;
}
function ouvirRobos(){
  onSnapshot(query(collection(db,'automacaoLog'),orderBy('quando','desc'),limit(250)),snap=>{
    const primeira=!vistos.size;
    eventos=snap.docs.map(d=>{const l=d.data();return{id:d.id,quando:ms(l.quando),ev:descreve(l)};});
    for(const e of eventos){if(!vistos.has(e.id)){vistos.add(e.id);if(!primeira&&e.ev&&Date.now()-e.quando<10*60000){fila.push(e);if(atual!==0)mostrar(0);}}}
    contadores();
  });
}

// ===== Cena 2: vendas do mês (GMV que os robôs atualizam 6x/dia) =====
async function cenaGmv(){
  const cs=(await getDocs(collection(db,'clientes'))).docs.map(d=>d.data()).filter(c=>c.ativo!==false&&c.nome!=='teste');
  const g=c=>({sh:Number(c.gmvShopeeAutomatico)||0,tt:Number(c.tiktokGmv)||0,ml:Number(c.gmvMlAutomatico)||0});
  let sh=0,tt=0,ml=0;const rk=cs.map(c=>{const x=g(c);sh+=x.sh;tt+=x.tt;ml+=x.ml;return{n:c.nome,t:x.sh+x.tt+x.ml};}).filter(x=>x.t>0).sort((a,b)=>b.t-a.t).slice(0,10);
  $('cenaGmv').innerHTML=`<div class="grid3" style="grid-template-columns:1.3fr 1fr 1fr 1fr">
    <div class="card"><div class="rot">Total do mês</div><div class="big" style="font-size:84px;color:var(--gold)">${fmtR(sh+tt+ml)}</div><div style="color:var(--dim);font-size:20px">${cs.length} clientes ativos</div></div>
    ${[['Shopee',sh,'var(--shopee)'],['TikTok Shop',tt,'var(--tiktok)'],['Mercado Livre',ml,'var(--ml)']].map(([n,v,c])=>`<div class="card"><div class="mp"><i style="background:${c}"></i>${n}</div><div class="big" style="font-size:58px;margin-top:14px">${fmtR(v)}</div></div>`).join('')}
  </div><div class="rot" style="margin-top:30px">Top 10 clientes no mês</div><div class="ranking">${rk.map((x,i)=>`<div><b>${i+1}º</b><span>${esc(x.n)}</span><em>${fmtR(x.t)}</em></div>`).join('')}</div>`;
}
// ===== Cena 3: placar da equipe (tarefas) =====
async function cenaEquipe(){
  const ts=(await getDocs(collection(db,'tarefas'))).docs.map(d=>d.data());const hoje=hojeBRT();
  const pessoas=['Lincoln','Caroline','Guilherme','Mirela'];
  $('cenaEquipe').innerHTML=`<div class="equipe">${pessoas.map(p=>{const m=ts.filter(t=>t.responsavel===p);const ab=m.filter(t=>t.coluna!=='feito');const atr=ab.filter(t=>t.prazo&&t.prazo<hoje).length;
    const feitasHoje=m.filter(t=>t.coluna==='feito'&&new Date(ms(t.concluidoEm||t.timestamp)-3*3600000).toISOString().slice(0,10)===hoje).length;
    const f=USER_FOTOS[p];return `<div class="card pessoa">${f?`<img src="${f}">`:`<div class="av">${p[0]}</div>`}<h3>${p==='Caroline'?'Carol':p}</h3>
      <div class="linha"><span>Abertas</span><b>${ab.length}</b></div><div class="linha" style="color:${atr?'var(--verm)':'inherit'}"><span>Atrasadas</span><b>${atr}</b></div><div class="linha" style="color:var(--verde)"><span>Feitas hoje</span><b>${feitasHoje}</b></div></div>`;}).join('')}</div>`;
}
// ===== Cena 4: precisa de ação (último resumo diário) =====
async function cenaAcao(){
  const r=(await getDocs(query(collection(db,'resumos'),orderBy('criadoEm','desc'),limit(1)))).docs[0]?.data();
  const linhas=String(r?.texto||'').split('\n').filter(l=>/^• \*/.test(l)&&!/Pedidos atrasados/.test(l));
  const itens=linhas.map(l=>{const m=l.match(/^• \*(.+?) \((\d+)\):\* (.*)$/);return m?{t:m[1],n:m[2],d:m[3]}:null;}).filter(Boolean).slice(0,6);
  $('cenaAcao').innerHTML=itens.length?`<div class="alertas">${itens.map(x=>`<div class="card alerta"><h3>${esc(x.t)}<b>${x.n}</b></h3><p>${esc(x.d)}</p></div>`).join('')}</div>`:'<div class="card" style="font-size:44px;text-align:center;padding:120px">✅ Nenhuma loja precisando de ação</div>';
}
// ===== Cena 5: comercial (CRM + SDR automático) =====
async function cenaComercial(){
  const ls=(await getDocs(collection(db,'crmLeads'))).docs.map(d=>d.data());const hoje=hojeBRT();
  const semana=new Date(Date.now()-7*86400000-3*3600000).toISOString().slice(0,10);
  const st=k=>ls.filter(l=>(l.stage||'novo')===k).length;
  const novosHoje=ls.filter(l=>l.createdDate===hoje).length,novosSemana=ls.filter(l=>(l.createdDate||'')>=semana).length;
  const lembretesHoje=eventos.filter(e=>e.ev?.tipo==='whats'&&e.quando>=+inicioDia()&&/lead/.test(e.ev.fala)).length;
  $('cenaComercial').innerHTML=`<div class="grid3" style="grid-template-columns:repeat(4,1fr)">
    ${[['Leads novos hoje',novosHoje,'var(--gold)'],['Leads na semana',novosSemana,'var(--txt)'],['Lembretes de agenda hoje',lembretesHoje,'#25d366'],['Reuniões agendadas',st('agendado'),'var(--azul)']].map(([r,n,c])=>`<div class="card"><div class="rot">${r}</div><div class="big" style="font-size:96px;color:${c}">${n}</div></div>`).join('')}
  </div><div class="rot" style="margin:34px 0 6px">Funil do CRM</div><div class="funil">
    ${[['Novo','novo','var(--gold)'],['Em contato','contato','#9fb6ff'],['Agendado','agendado','var(--azul)'],['Compareceu','compareceu','#4dd6c0'],['Fechado','fechado','var(--verde)']].map(([n,k,c])=>`<div class="etapa"><div class="big" style="color:${c}">${st(k)}</div><div class="rot">${n}</div></div>`).join('')}</div>`;
}
async function atualizarPaineis(){try{await Promise.all([cenaGmv(),cenaEquipe(),cenaAcao(),cenaComercial()]);}catch(e){console.error(e);}}

onAuthStateChanged(auth,u=>{
  if(!u){$('login').style.display='flex';return;}
  $('login').style.display='none';ouvirRobos();atualizarPaineis();setInterval(atualizarPaineis,5*60000);mostrar(0);
  setTimeout(()=>location.reload(),6*3600000); // recarrega a cada 6h (pega versão nova do sistema)
});
$('btnLogin').onclick=()=>signInWithPopup(auth,new GoogleAuthProvider()).catch(e=>alert(e.message));
</script>
