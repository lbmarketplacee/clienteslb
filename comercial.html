<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LB Comercial</title>
<meta name="theme-color" content="#0b0b0c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="LB Comercial">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23080808'/%3E%3Crect x='1' y='1' width='62' height='62' rx='13' fill='none' stroke='%23d4a94a' stroke-width='2'/%3E%3Ctext x='32' y='44' font-family='Georgia,serif' font-weight='bold' font-size='28' fill='%23d4a94a' text-anchor='middle'%3ELB%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f7f9;--card:#fff;--line:#e6e8ec;--txt:#14161a;--dim:#6b7280;--mut:#9ca3af;--ouro:#c9a24a;--ouro2:#f6eedb;--side:#0b0b0c;--azul:#2563eb;--azul2:#e8efff;--verde:#16a34a;--verde2:#e7f6ec;--verm:#dc2626;--verm2:#fdeaea;--lar:#ea7a1c;--lar2:#fdf0e3;--roxo:#7c3aed;--roxo2:#f1eafe;--sombra:0 1px 2px rgba(16,24,40,.04),0 1px 3px rgba(16,24,40,.06)}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font-family:Inter,system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--txt);font-size:14px;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--azul)}
.hide{display:none!important}
/* login */
#login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 30% 20%,#1c1a14,#0b0b0c 60%);color:#fff;z-index:50}
#login .box{width:min(380px,92vw);text-align:center}
.logo{font-family:Georgia,serif;font-weight:700;letter-spacing:.02em;color:var(--ouro)}
#login .logo{font-size:56px}#login h1{font-size:20px;margin:6px 0 4px;font-weight:700}#login p{color:#a1a1aa;margin:0 0 26px;font-size:13.5px}
.btn-google{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;background:#fff;color:#111;border:0;border-radius:12px;padding:13px 16px;font-weight:600}
#loginErro{color:#fca5a5;font-size:13px;margin-top:14px;min-height:18px}
/* layout */
#app{display:flex;height:100%}
aside{width:228px;flex-shrink:0;background:var(--side);color:#d4d4d8;display:flex;flex-direction:column;padding:18px 12px}
aside .marca{display:flex;align-items:center;gap:10px;padding:2px 8px 18px}
aside .marca .logo{font-size:28px}aside .marca b{display:block;color:#fff;font-size:14px;letter-spacing:.06em}aside .marca span{font-size:11px;color:#a1a1aa}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:11px;width:100%;background:none;border:0;border-radius:10px;padding:10px 11px;color:#d4d4d8;text-align:left;font-weight:500}
.nav button:hover{background:#18181b}.nav button.on{background:linear-gradient(90deg,#2a2416,#1a1712);color:#fff;box-shadow:inset 3px 0 0 var(--ouro)}
.nav button svg{width:18px;height:18px;flex-shrink:0;opacity:.9}
.nav .bdg{margin-left:auto;background:var(--verm);color:#fff;border-radius:999px;font-size:11px;font-weight:700;padding:1px 7px}
.nav .bdg.ok{background:#3f3f46}
aside .quem{margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px;border-top:1px solid #27272a}
.av{width:34px;height:34px;border-radius:50%;background:var(--ouro2);color:#7a5a12;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0}
aside .quem b{color:#fff;font-size:13px;display:block}aside .quem span{font-size:11px;color:#a1a1aa}
aside .quem button{margin-left:auto;background:none;border:0;color:#a1a1aa;font-size:12px}
main{flex:1;min-width:0;display:flex;flex-direction:column;height:100%}
.topo{height:58px;flex-shrink:0;display:flex;align-items:center;gap:12px;padding:0 24px;background:#fff;border-bottom:1px solid var(--line)}
.topo h2{font-size:16px;margin:0;font-weight:700}.topo .sub{color:var(--dim);font-size:12.5px}
.topo .dir{margin-left:auto;display:flex;align-items:center;gap:10px}
.vivo{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--verde);background:var(--verde2);padding:5px 10px;border-radius:999px;font-weight:600}
.vivo:before{content:'';width:7px;height:7px;border-radius:50%;background:var(--verde);animation:pul 1.6s infinite}
@keyframes pul{50%{opacity:.35}}
.conteudo{flex:1;overflow:auto;padding:22px 24px 40px}
.pg{display:none}.pg.on{display:block}
/* blocos */
.sec{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--dim);text-transform:uppercase;margin:22px 0 10px}
.sec:first-child{margin-top:0}
.grid{display:grid;gap:14px}.g5{grid-template-columns:repeat(5,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g7{grid-template-columns:repeat(7,minmax(0,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sombra)}
.kpi{padding:16px 16px 14px;display:flex;gap:12px;align-items:flex-start}
.kpi .ic{width:40px;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.kpi .ic svg{width:20px;height:20px}
.g7 .kpi .ic{display:none}.g7 .kpi{padding:14px}.kpi>div:last-child{min-width:0}.kpi span{display:block;font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--dim);text-transform:uppercase}
.kpi b{display:block;font-size:26px;font-weight:800;line-height:1.15;margin:2px 0}
.kpi em{display:block;font-style:normal;font-size:12px;color:var(--dim)}
.kpi em.bom{color:var(--verde)}.kpi em.ruim{color:var(--verm)}
.c-az .ic{background:var(--azul2);color:var(--azul)}.c-az b{color:var(--azul)}
.c-ve .ic{background:var(--verde2);color:var(--verde)}.c-ve b{color:var(--verde)}
.c-vm .ic{background:var(--verm2);color:var(--verm)}.c-vm b{color:var(--verm)}
.c-la .ic{background:var(--lar2);color:var(--lar)}.c-la b{color:var(--lar)}
.c-ro .ic{background:var(--roxo2);color:var(--roxo)}.c-ro b{color:var(--roxo)}
.c-ou .ic{background:var(--ouro2);color:#9a7416}.c-ou b{color:#9a7416}
.painel{padding:18px 20px}.painel h3{margin:0;font-size:16px;font-weight:700}.painel .ds{color:var(--dim);font-size:13px;margin:3px 0 14px}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 13px;font-weight:500;font-size:13px}
.chip.on{background:var(--azul);border-color:var(--azul);color:#fff}
.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 13px;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:#f9fafb}.btn:disabled{opacity:.5;cursor:default}
.btn.pri{background:var(--txt);color:#fff;border-color:var(--txt)}.btn.pri:hover{background:#000}
.btn.ouro{background:var(--ouro);border-color:var(--ouro);color:#1a1405}
.btn.ve{background:var(--verde);border-color:var(--verde);color:#fff}
.btn.vm{color:var(--verm)}.btn.zap{color:#128c4b;border-color:#bfe8cf;background:#f1fbf5}
.btn.sm{padding:5px 9px;font-size:12px;border-radius:8px}
input[type=text],input[type=email],input[type=date],input[type=time],input[type=search],select,textarea{border:1px solid var(--line);border-radius:10px;padding:8px 11px;background:#fff;outline:none;width:100%}
input:focus,select:focus,textarea:focus{border-color:#a5b4fc;box-shadow:0 0 0 3px #e0e7ff}
.vazio{color:var(--dim);text-align:center;padding:30px 10px;font-size:13px}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:#f3f4f6;color:#374151;margin:2px 4px 0 0;white-space:nowrap}
.tag.az{background:var(--azul2);color:var(--azul)}.tag.ve{background:var(--verde2);color:var(--verde)}.tag.vm{background:var(--verm2);color:var(--verm)}.tag.la{background:var(--lar2);color:#b45309}.tag.ou{background:var(--ouro2);color:#7a5a12}.tag.ro{background:var(--roxo2);color:var(--roxo)}
/* funil do dashboard */
.funil{display:flex;flex-direction:column;gap:8px}
.f-lin{display:grid;grid-template-columns:150px 1fr 70px;align-items:center;gap:12px}
.f-lin .rot{font-weight:600;font-size:13px}.f-lin .rot em{display:block;font-style:normal;color:var(--dim);font-weight:500;font-size:11.5px}
.f-bar{height:34px;background:#f3f4f6;border-radius:9px;overflow:hidden;position:relative}
.f-bar i{position:absolute;left:0;top:0;bottom:0;border-radius:9px;transition:width .6s}
.f-bar span{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-weight:700;font-size:12.5px;color:#374151}
.f-lin .n{text-align:right;font-weight:800;font-size:16px}
.passo{display:block;margin:-2px 0 2px 162px;font-size:12px;color:var(--dim);line-height:1.5}
.passo b{color:var(--txt)}.passo .gap{color:var(--verm);font-weight:700}.passo .okk{color:var(--verde);font-weight:700}
.passo .garg{background:var(--verm);color:#fff;border-radius:6px;padding:1px 7px;font-weight:700;font-size:11px}
.diag{display:flex;flex-direction:column;gap:8px}
.diag div{border-radius:11px;padding:11px 13px;font-size:13px;line-height:1.45;border:1px solid var(--line);background:#fff}
.diag .alto{border-color:#fecaca;background:#fff7f7}.diag .medio{border-color:#fde68a;background:#fffcf2}.diag .ok{border-color:#bbf7d0;background:#f4fdf7}.diag .info{background:#f9fafb}
.diag small{display:block;color:var(--dim);margin-top:3px;font-weight:600}
table.tb{width:100%;border-collapse:collapse;font-size:13px}
.tb th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);font-weight:600;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tb td{padding:10px;border-bottom:1px solid #f1f2f4;white-space:nowrap}
.tb td.num,.tb th.num{text-align:right}
.tb tr:last-child td{border-bottom:0}
.tabw{overflow:auto}
.barras{display:flex;flex-direction:column;gap:8px}
.barras .l{display:grid;grid-template-columns:minmax(120px,200px) 1fr 40px;gap:10px;align-items:center;font-size:13px}
.barras .t{height:10px;border-radius:9px;background:#f3f4f6;overflow:hidden}.barras .t i{display:block;height:100%;border-radius:9px;background:var(--verm)}
.calor{display:grid;grid-template-columns:40px repeat(24,1fr);gap:3px;font-size:10.5px;color:var(--dim)}
.calor i{display:block;height:22px;border-radius:5px;background:#eef2ff}
.calor .h{text-align:center}
/* meu dia / listas */
.item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid #f1f2f4}
.item:last-child{border-bottom:0}
.item .inf{flex:1;min-width:0}.item .inf b{display:block;font-size:14px;cursor:pointer}.item .inf b:hover{text-decoration:underline}
.item .inf em{display:block;font-style:normal;color:var(--dim);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .ac{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.bloco-cab{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line)}
.bloco-cab b{font-size:15px}.bloco-cab .n{background:#f3f4f6;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:700}.bloco-cab em{margin-left:auto;font-style:normal;color:var(--dim);font-size:12px}
/* atendimentos */
.chat{display:grid;grid-template-columns:330px 1fr 320px;height:calc(100vh - 58px);margin:-22px -24px -40px;background:#fff}
.c-lista{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.c-lista .busca{padding:12px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.c-filtros{display:flex;gap:4px;overflow-x:auto}.c-filtros button{border:0;background:#f3f4f6;border-radius:8px;padding:5px 9px;font-size:12px;font-weight:600;white-space:nowrap;color:#374151}
.c-filtros button.on{background:var(--txt);color:#fff}
.c-itens{overflow:auto;flex:1}
.ci{display:flex;gap:10px;padding:11px 12px;border-bottom:1px solid #f3f4f6;cursor:pointer}
.ci:hover{background:#fafafa}.ci.on{background:#f3f6ff}
.ci .inf{flex:1;min-width:0}.ci .l1{display:flex;gap:6px;align-items:baseline}.ci .l1 b{font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ci .l1 span{margin-left:auto;font-size:11px;color:var(--mut);white-space:nowrap}
.ci .pv{font-size:12.5px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin:2px 0 3px}
.ci .naolida{background:var(--verde);color:#fff;border-radius:999px;font-size:10.5px;font-weight:700;padding:0 6px;margin-left:4px}
.c-conv{display:flex;flex-direction:column;min-width:0;min-height:0;background:#f7f5f1}
.c-cab{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#fff;border-bottom:1px solid var(--line)}
.c-cab .inf{flex:1;min-width:0}.c-cab b{display:block}.c-cab em{font-style:normal;color:var(--dim);font-size:12px}
.c-msgs{flex:1;overflow:auto;padding:16px 18px;display:flex;flex-direction:column;gap:6px}
.bal{max-width:74%;padding:8px 11px 5px;border-radius:12px;font-size:13.5px;line-height:1.42;white-space:pre-wrap;word-wrap:break-word;box-shadow:0 1px 1px rgba(0,0,0,.05)}
.bal.lead{background:#fff;align-self:flex-start;border-top-left-radius:4px}
.bal.eq{background:#dcf8c6;align-self:flex-end;border-top-right-radius:4px}
.bal.ia{background:#e8efff;align-self:flex-end;border-top-right-radius:4px}
.bal.nota{background:#fff7d6;border:1px dashed #e6c55a;align-self:center;max-width:86%;font-size:12.5px}
.bal small{display:block;text-align:right;font-size:10.5px;color:var(--mut);margin-top:2px}
.bal .quem{display:block;font-size:11px;font-weight:700;color:#4b5563;margin-bottom:1px}
.dia-sep{align-self:center;font-size:11px;background:#fff;border-radius:7px;padding:3px 9px;color:var(--dim);margin:6px 0}
.c-env{background:#fff;border-top:1px solid var(--line);padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.c-env .lin{display:flex;gap:8px;align-items:flex-end}
.c-env textarea{resize:none;min-height:42px;max-height:160px}
.c-env.nota textarea{background:#fffbea;border-color:#f3d77a}
.aviso{font-size:12px;padding:8px 10px;border-radius:9px;background:var(--lar2);color:#92400e}
.c-ficha{border-left:1px solid var(--line);overflow:auto;padding:14px;min-width:0}
.c-vazio{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;color:var(--dim);height:100%}.c-vazio svg{width:44px;height:44px;opacity:.5}
/* ficha */
.fx h4{margin:16px 0 8px;font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--dim)}
.fx .nome{font-size:18px;font-weight:800;margin:0}
.fx .lin{display:flex;gap:6px;flex-wrap:wrap}
.fx .campo{display:grid;grid-template-columns:96px 1fr;gap:6px;font-size:13px;padding:4px 0}.fx .campo span{color:var(--dim)}
.etapas{display:flex;flex-wrap:wrap;gap:5px}
.etapas button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 10px;font-size:12px;font-weight:600}
.etapas button.on{color:#fff;border-color:transparent}
.reuniao{border:1px solid #bfdbfe;background:#f5f9ff;border-radius:12px;padding:11px 12px;font-size:13px}
.reuniao b{display:block;font-size:14px}
.tl{display:flex;flex-direction:column;gap:7px;font-size:12.5px}.tl div{border-left:2px solid var(--line);padding:0 0 0 9px}.tl em{display:block;font-style:normal;color:var(--mut);font-size:11px}
.ia-box{background:var(--roxo2);border-radius:11px;padding:10px 12px;font-size:12.5px;line-height:1.45}
/* funil kanban */
.kan{display:flex;gap:12px;overflow-x:auto;padding-bottom:10px;align-items:flex-start}
.kcol{width:272px;flex-shrink:0;background:#eef0f3;border-radius:13px;display:flex;flex-direction:column;max-height:calc(100vh - 190px)}
.kcol.min{width:46px}.kcol.min .kcards,.kcol.min .kcab .n,.kcol.min .kcab .nm{display:none}.kcol.min .kcab{writing-mode:vertical-rl;padding:12px 0;align-items:center}
.kcab{display:flex;align-items:center;gap:8px;padding:11px 12px;font-weight:700;font-size:13px;cursor:pointer}
.kcab i{width:9px;height:9px;border-radius:50%}.kcab .n{margin-left:auto;background:#fff;border-radius:999px;padding:0 8px;font-size:12px}
.kcards{overflow:auto;padding:0 9px 10px;display:flex;flex-direction:column;gap:8px;min-height:60px}
.kcards.sobre{background:#e0e7ff;border-radius:10px}
.kc{background:#fff;border-radius:11px;padding:10px 11px;box-shadow:var(--sombra);cursor:pointer;border:1px solid transparent}
.kc:hover{border-color:#c7d2fe}.kc b{display:block;font-size:13.5px}.kc em{display:block;font-style:normal;font-size:12px;color:var(--dim);margin-top:2px}
.kc .rod{display:flex;align-items:center;gap:4px;margin-top:6px;flex-wrap:wrap}
.kc .dono{margin-left:auto;font-size:11px;color:var(--dim);font-weight:600}
.k-mob{display:none}
/* agenda */
.ag-dia{margin-bottom:16px}.ag-dia>b{display:block;margin:0 0 8px;font-size:13px;color:var(--dim);text-transform:capitalize}
.ev{display:flex;gap:12px;align-items:center;padding:12px 14px;border-bottom:1px solid #f1f2f4}
.ev:last-child{border-bottom:0}.ev .hr{font-weight:800;font-size:15px;width:58px;flex-shrink:0}
.ev .inf{flex:1;min-width:0}.ev .inf b{display:block}.ev .inf em{display:block;font-style:normal;color:var(--dim);font-size:12.5px}
.livres{display:flex;flex-wrap:wrap;gap:6px}
.livres button{border:1px solid #bbf7d0;background:#f0fdf4;color:#166534;border-radius:9px;padding:6px 10px;font-weight:700;font-size:12.5px}
.livres button:hover{background:#dcfce7}.livres .ocup{border:1px solid var(--line);background:#f9fafb;color:var(--mut);border-radius:9px;padding:6px 10px;font-size:12.5px;text-decoration:line-through}
/* modal / drawer */
.ov{position:fixed;inset:0;background:rgba(15,17,21,.45);z-index:40;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:#fff;border-radius:16px;width:min(560px,100%);max-height:92vh;overflow:auto;padding:20px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.modal h3{margin:0 0 4px;font-size:17px}.modal .ds{color:var(--dim);font-size:13px;margin:0 0 14px}
.modal label{display:block;font-size:12px;font-weight:600;color:var(--dim);margin:10px 0 5px}
.modal .acoes{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,100%);background:#fff;z-index:41;box-shadow:-10px 0 40px rgba(0,0,0,.18);overflow:auto;padding:18px 18px 40px;transform:translateX(100%);transition:transform .22s}
.drawer.on{transform:none}
.drawer .fechar{position:sticky;top:0;float:right;border:0;background:#f3f4f6;border-radius:9px;width:32px;height:32px;font-size:18px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;border-radius:11px;font-size:13px;z-index:60;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:92vw}
.carreg{color:var(--dim);padding:24px;text-align:center}
.mob-bar{display:none}
/* responsivo */

// ---------- estado ----------
const S = { email: '', nome: '', papel: '', pagina: 'dia', leads: [], convs: [], clientesTel: {}, metas: { ...M.METAS_PADRAO }, periodo: '30', funilDono: 'todos', funilBusca: '', funilMin: lerLS('cmFunilMin', ['perdido']), chatFiltro: 'responder', chatBusca: '', chatAberta: null, chatNota: false, agenda: null, agendaDia: null, meta: null, metaDias: 30, templates: null, prontoLeads: false, prontoConvs: false };
function lerLS(k, pad) { try { const v = JSON.parse(localStorage.getItem(k)); return v ?? pad; } catch (e) { return pad; } }
function gravarLS(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { } }

const $ = (s) => document.querySelector(s);
const esc = (t) => String(t ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const low = (t) => String(t || '').toLowerCase();

const N = (v) => (v == null ? '—' : Number(v).toLocaleString('pt-BR'));
const P = (v) => (v == null ? '—' : String(v).replace('.', ',') + '%');

let toastT; function toast(t) { let el = $('.toast'); if (!el) { el = document.createElement('div'); el.className = 'toast'; document.body.appendChild(el); } el.textContent = t; el.style.display = 'block'; clearTimeout(toastT); toastT = setTimeout(() => (el.style.display = 'none'), 3800); }

// ---------- período ----------
function periodo() {
  const h = hoje();
  if (S.periodo === 'hoje') return { de: h, ate: h, rot: 'hoje' };
  if (S.periodo === 'mes') return { de: h.slice(0, 8) + '01', ate: h, rot: 'este mês' };
  if (S.periodo === 'mesant') { const d = new Date(h.slice(0, 8) + '01T12:00:00Z'); d.setUTCDate(0); const ate = d.toISOString().slice(0, 10); return { de: ate.slice(0, 8) + '01', ate, rot: 'mês passado' }; }
  const n = Number(S.periodo) || 30; return { de: M.somaDias(h, -(n - 1)), ate: h, rot: `últimos ${n} dias` };
}
function periodoAnterior(p) { const dias = Math.round((Date.parse(p.ate) - Date.parse(p.de)) / 86400000) + 1; return { de: M.somaDias(p.de, -dias), ate: M.somaDias(p.de, -1) }; }
const chipsPeriodo = () => `<div class="chips">${[['hoje', 'Hoje'], ['7', '7 dias'], ['30', '30 dias'], ['mes', 'Este mês'], ['mesant', 'Mês passado'], ['90', '90 dias']].map(([k, r]) => `<button class="chip ${S.periodo === k ? 'on' : ''}" data-per="${k}">${r}</button>`).join('')}</div>`;
document.addEventListener('click', (e) => { const b = e.target.closest('[data-per]'); if (b) { S.periodo = b.dataset.per; render(); if (S.pagina === 'camp' || S.pagina === 'dash') carregarMeta(true); } });

const kpi = (cor, ic, rot, val, sub, subCls = '') => `<div class="card kpi ${cor}"><div class="ic">${ico(ic)}</div><div><span>${rot}</span><b>${val}</b><em class="${subCls}">${sub || ''}</em></div></div>`;
function variacao(a, b, inverso = false) { if (a == null || b == null || !b) return ['', '']; const d = Math.round(((a - b) / b) * 100); if (!d) return ['= período anterior', '']; const bom = inverso ? d < 0 : d > 0; return [`${d > 0 ? '▲' : '▼'} ${Math.abs(d)}% vs período anterior`, bom ? 'bom' : 'ruim']; }

    passos: ps.map((x) => ({ passo: x.rot, taxa: x.taxa, meta: x.meta, ficaram: x.perdidos, gargalo: !!x.gargalo, responsavel: x.quem })),
    primeiroContato: M.tempoResposta(L, { ...p, limiteMin: S.metas.respostaMin }),

    equipe: M.porPessoa(L, TIME, p).map((x) => ({ nome: x.nome, papel: x.papel, leads: x.leads, contatosFeitos: x.contatos, reunioesMarcadas: x.marcou, reunioes: x.reunioes, comparecimento: x.showRate, fechados: x.fechados, abertos: x.abertos, atrasados: x.atrasados, parados7d: x.parados, primeiroContatoMin: x.resposta.medianaMin })),

}

function mudancaEtapa(l, stage, atividades) {

  const lista = atividades || [...(l.atividades || [])]; lista.push({ tipo: 'etapa', de, para: stage, quando: agora, por: S.nome });

  if (stage === 'agendado' && !l.agendadoEm) { p.agendadoEm = h; p.agendadoPor = S.nome; }
  if (stage === 'compareceu' && !l.compareceuEm) p.compareceuEm = h;
  if (stage === 'fechado' && de !== 'fechado') { p.fechadoEm = h; p.fechadoPor = l.donoNome || S.nome; }
  if (stage === 'fechado' || stage === 'perdido') { p.proximoContato = ''; p.cadencia = null; }
  if (!l.primeiraRespostaEm && de === 'novo') p.primeiraRespostaEm = agora;
  return p;
}
function aplicarAtividade(l, tipo, { nota = '', data = '', motivo = '' } = {}) {
  const h = hoje(), agora = Date.now(); const a = { tipo, quando: agora, por: S.nome }; if (nota) a.nota = nota; if (data) a.data = data; if (motivo) a.motivo = motivo;
  const atividades = [...(l.atividades || []), a]; let p = { atividades, atualizadoEm: h };
  if (tipo === 'nao_atendeu' || tipo === 'whatsapp') { p.tentativas = (l.tentativas || 0) + 1; const c = M.proximaCadencia(atividades); p.proximoContato = c.data || ''; p.cadencia = c.etapa; }

  const ov = document.createElement('div'); ov.className = 'ov'; ov.innerHTML = `<div class="modal">${html}</div>`; document.body.appendChild(ov);
  const fechar = () => { ov.remove(); ov.dispatchEvent(new Event('fechou')); };
  ov.addEventListener('click', (e) => { if (e.target === ov || e.target.closest('[data-fechar]')) fechar(); });
  ligar && ligar(ov); return ov;
}
// cliques globais (ficha, conversa, tentativa, marcar)
document.addEventListener('click', (e) => {
  const ir = e.target.closest('[data-ir]'); if (ir) { const alvo = ir.dataset.ir; if (alvo.startsWith('#')) { irPara(alvo.slice(1)); return; } const el = document.getElementById(alvo); if (el) { el.scrollIntoView({ behavior: 'smooth', block: 'start' }); el.animate([{ boxShadow: '0 0 0 3px #D4A94A' }, { boxShadow: '0 0 0 0 transparent' }], { duration: 1400 }); } return; }
  const f = e.target.closest('[data-ficha]'); if (f && !e.target.closest('button,a')) { document.querySelectorAll('.ov').forEach((o) => o.remove()); abrirFicha(f.dataset.ficha); return; }
  const c = e.target.closest('[data-conv]'); if (c) { $('#drawer').classList.remove('on'); document.querySelectorAll('.ov').forEach((o) => o.remove()); abrirConversa(c.dataset.conv); return; }
  const t = e.target.closest('[data-tent]'); if (t) { tentativa(t.dataset.id, t.dataset.tent); return; }
  const m = e.target.closest('[data-marcar]'); if (m) { marcarReuniao(m.dataset.marcar); return; }
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { $('#drawer').classList.remove('on'); document.querySelectorAll('.ov').forEach((o) => o.remove()); } });
</script>
