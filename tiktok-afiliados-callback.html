<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conectando afiliados TikTok — LB Marketplace</title>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<style>
:root{--bg:#0a0a09;--gold:#d4a94a;--text:#f3f0e8;--dim:#a39d8c;--green:#5cb88a;--red:#e0525a;--card:#12110f;--border:#2a261c}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;padding:16px}
.card{width:min(460px,100%);background:var(--card);border:1px solid var(--border);border-radius:16px;padding:28px;text-align:center}
h1{font-size:20px;margin:12px 0 8px}p{color:var(--dim);line-height:1.5;margin:0 0 18px}
.ok{color:var(--green)}.erro{color:var(--red)}
.spin{width:34px;height:34px;border:3px solid var(--border);border-top-color:var(--gold);border-radius:50%;margin:0 auto;animation:g .8s linear infinite}
@keyframes g{to{transform:rotate(360deg)}}
a.botao{display:inline-block;background:var(--gold);color:#181712;text-decoration:none;font-weight:600;padding:10px 18px;border-radius:10px}
</style>
</head>
<body>
<div class="card" id="card"><div class="spin"></div><h1>Conectando os afiliados do TikTok…</h1><p>Só um instante.</p></div>
<script>
firebase.initializeApp({apiKey:"AIzaSyD7kPODN3ZHzM8SuRlB_vdYC276YOzzXPE",authDomain:"lb-gestao-clientes.firebaseapp.com",projectId:"lb-gestao-clientes",storageBucket:"lb-gestao-clientes.firebasestorage.app",messagingSenderId:"344033285587",appId:"1:344033285587:web:fbdae7d44eaf5bac760b26"});
const card=document.getElementById('card');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fim=(ok,titulo,texto)=>{card.innerHTML=`<h1 class="${ok?'ok':'erro'}">${esc(titulo)}</h1><p>${esc(texto)}</p><a class="botao" href="https://sistema.lbmarketplace.com.br/#loja">Voltar ao sistema</a>`;};
const q=new URLSearchParams(location.search);const code=q.get('code'),clienteId=q.get('state');
if(!code||!clienteId)fim(false,'Não deu pra conectar','O TikTok não devolveu o código de autorização. Tente de novo pelo sistema.');
else firebase.auth().onAuthStateChanged(async u=>{
  if(!u){fim(false,'Faça login no sistema','Abra o sistema LB neste mesmo navegador, entre com sua conta e tente de novo.');return;}
  try{
    const r=await (await fetch('https://lb-shopee-gmv.vercel.app/api/tiktok-afiliados',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+await u.getIdToken()},body:JSON.stringify({acao:'trocar_codigo',code,clienteId})})).json();
    if(r.ok)fim(true,'Afiliados conectados',`Loja ${r.loja}: o sistema já pode gerenciar os planos de afiliados.`);
    else fim(false,'Não deu pra conectar',r.erro||'Erro desconhecido.');
  }catch(e){fim(false,'Erro de conexão',e.message);}
});
</script>
</body>
</html>
