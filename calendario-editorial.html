<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Calendário editorial · LB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Oswald:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f0e0b;--card:#1a1814;--card2:#221f19;--borda:#33302a;--txt:#f1ece2;--sub:#a59d8d;--ouro:#d4af5a;--verm:#e0574a;--verde:#4fbf7f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font-family:Inter,system-ui,sans-serif;font-size:14px}
a{color:var(--ouro)}
.topo{display:flex;align-items:center;gap:12px;padding:16px max(16px,env(safe-area-inset-left)) 10px;flex-wrap:wrap}
.topo h1{font-family:Oswald,sans-serif;font-weight:600;font-size:22px;margin:0;letter-spacing:.5px}
.topo .sub{color:var(--sub);font-size:12px}
.esp{flex:1}
.wrap{padding:0 max(16px,env(safe-area-inset-right)) 40px max(16px,env(safe-area-inset-left))}
.aviso{background:var(--card2);border:1px solid var(--borda);border-radius:10px;padding:10px 12px;color:var(--sub);font-size:12.5px;margin-bottom:12px}
.barra{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.tog{background:var(--card);border:1px solid var(--borda);color:var(--txt);padding:7px 12px;border-radius:999px;cursor:pointer;font:inherit;font-size:13px}
.tog.on{background:var(--ouro);color:#1a1408;border-color:var(--ouro);font-weight:600}
select,input[type=search]{background:var(--card);border:1px solid var(--borda);color:var(--txt);padding:7px 10px;border-radius:8px;font:inherit;font-size:13px}
.nums{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:12px}
.num{background:var(--card);border:1px solid var(--borda);border-radius:12px;padding:10px 12px}
.num b{display:block;font-family:Oswald,sans-serif;font-size:24px;color:var(--ouro)}
.num span{font-size:11.5px;color:var(--sub);text-transform:uppercase;letter-spacing:.5px}
.tabela{overflow-x:auto;border:1px solid var(--borda);border-radius:12px;background:var(--card)}
table{border-collapse:collapse;width:100%;min-width:860px}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--borda);vertical-align:top}
th{font-size:11.5px;color:var(--sub);text-transform:uppercase;letter-spacing:.5px;font-weight:600;position:sticky;top:0;background:var(--card)}
tr.linha{cursor:pointer}
tr.linha:hover td{background:var(--card2)}
tr.atras td{background:rgba(224,87,74,.12)}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.mini{color:var(--sub);font-size:12px}
.quadro{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(230px,1fr);gap:10px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--card);border:1px solid var(--borda);border-radius:12px;padding:10px;min-width:0}
.col h3{margin:0 0 8px;font-size:13px;display:flex;justify-content:space-between}
.cartao{background:var(--card2);border:1px solid var(--borda);border-radius:10px;padding:9px;margin-bottom:8px;cursor:pointer}
.cartao.atras{border-color:var(--verm)}
.cartao img{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:8px;margin-bottom:6px;display:block}
.mes{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.dsem{font-size:11px;color:var(--sub);text-align:center;text-transform:uppercase}
.dia{background:var(--card);border:1px solid var(--borda);border-radius:10px;min-height:96px;padding:6px;min-width:0}
.dia.fora{opacity:.35}
.dia.hoje{border-color:var(--ouro)}
.dia .n{font-size:12px;color:var(--sub)}
.dia .ev{font-size:11.5px;background:var(--card2);border-radius:6px;padding:3px 5px;margin-top:4px;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-left:3px solid var(--ouro)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:flex-start;justify-content:center;padding:30px 16px;overflow:auto;z-index:20}
.caixa{background:var(--card);border:1px solid var(--borda);border-radius:14px;max-width:760px;width:100%;padding:18px}
.caixa h2{font-family:Oswald,sans-serif;margin:0 0 6px;font-size:20px}
.midias{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:12px 0}
.midias img,.midias video{width:100%;border-radius:8px;display:block}
.legenda{white-space:pre-wrap;background:var(--card2);border-radius:10px;padding:10px;line-height:1.5}
.btn{background:var(--card2);border:1px solid var(--borda);color:var(--txt);padding:8px 14px;border-radius:8px;cursor:pointer;font:inherit}
.btn-ouro{background:var(--ouro);border:0;color:#1a1408;padding:10px 18px;border-radius:999px;font-weight:700;cursor:pointer;font:inherit}
.login{max-width:380px;margin:12vh auto;text-align:center;padding:0 16px}
.login h1{font-family:Oswald,sans-serif}
@media (max-width:640px){.mes{gap:3px}.dia{min-height:64px;padding:3px}.dia .ev{font-size:10px}}
</style>
</head>
<body>
<div id="tLogin" class="login" hidden>
  <h1>Calendário editorial da LB</h1>
  <p class="mini">Entre com o seu e-mail da equipe LB.</p>
  <button class="btn-ouro" id="btnGoogle">Entrar com Google</button>
  <p id="loginErro" class="mini" style="color:var(--verm)"></p>
</div>
<div id="tApp" hidden>
  <div class="topo">
    <div><h1>Calendário editorial da LB</h1><div class="sub" id="sub">carregando…</div></div>
    <span class="esp"></span>
    <a class="btn" href="/" style="text-decoration:none">← Sistema</a>
  </div>
  <div class="wrap">
    <div class="aviso">Quem cria e altera os posts é a gerente de marketing, no sistema da Potencial. Aqui a equipe da LB só acompanha — tudo que ela mexe aparece aqui na hora.</div>
    <div class="nums" id="nums"></div>
    <div class="barra">
      <button class="tog" data-v="tabela">Tabela</button><button class="tog" data-v="quadro">Por status</button><button class="tog" data-v="mes">Calendário</button>
      <span class="esp"></span>
      <input type="search" id="busca" placeholder="Buscar post…">
      <select id="fResp"></select><select id="fStatus"></select><select id="fFormato"></select>
    </div>
    <div id="vista"></div>
  </div>
</div>
<div id="modal" class="modal" hidden></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import { getAuth, onAuthStateChanged, GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

const firebaseConfig = { apiKey: "AIzaSyD7kPODN3ZHzM8SuRlB_vdYC276YOzzXPE", authDomain: "lb-gestao-clientes.firebaseapp.com", projectId: "lb-gestao-clientes", storageBucket: "lb-gestao-clientes.firebasestorage.app", messagingSenderId: "344033285587", appId: "1:344033285587:web:fbdae7d44eaf5bac760b26" };
const app = initializeApp(firebaseConfig); const auth = getAuth(app); const db = getFirestore(app);
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const celular = () => /Android|iPhone|iPad/i.test(navigator.userAgent);
const STATUS = ['Aguardando conteúdo', 'Em produção', 'Para revisão', 'Feed do cliente', 'Ajuste', 'Aprovado', 'Agendado', 'Postado'];
const COR = { 'Aguardando conteúdo': '#6b6558', 'Em produção': '#3b82c4', 'Para revisão': '#a06cd5', 'Feed do cliente': '#d4af5a', 'Ajuste': '#e0574a', 'Aprovado': '#4fbf7f', 'Agendado': '#2fa3a3', 'Postado': '#8a8a8a' };
const ENTREGUE = ['Para revisão', 'Feed do cliente', 'Aprovado', 'Agendado', 'Postado'];
const DIAS = ['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb'];
const hoje = () => new Date(Date.now() - 3 * 3600_000).toISOString().slice(0, 10);
const fmt = (d) => (d ? d.split('-').reverse().slice(0, 2).join('/') + ' ' + DIAS[new Date(d + 'T12:00:00').getDay()] : '—');
const pill = (s) => s ? `<span class="pill" style="background:${COR[s] || '#555'}22;color:${COR[s] || '#ccc'};border:1px solid ${COR[s] || '#555'}">${esc(s)}</span>` : '<span class="mini">—</span>';
const atrasado = (p) => p.status === 'Ajuste' || (p.dataEntrega && p.dataEntrega < hoje() && !ENTREGUE.includes(p.status));
let ler = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } };
const gravar = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch { /* sem armazenamento */ } };
const S = { posts: [], vista: ler('ceVista', 'tabela'), mes: hoje().slice(0, 7), f: ler('ceFiltro', { resp: '', status: '', formato: '' }), busca: '' };

$('#btnGoogle').onclick = async () => { const p = new GoogleAuthProvider(); p.setCustomParameters({ prompt: 'select_account' }); try { celular() ? await signInWithRedirect(auth, p) : await signInWithPopup(auth, p); } catch (e) { $('#loginErro').textContent = 'Não entrou: ' + (e.code || e.message); } };
getRedirectResult(auth).catch(() => {});
onAuthStateChanged(auth, (u) => {
  $('#tLogin').hidden = !!u; $('#tApp').hidden = !u;
  if (!u) return;
  onSnapshot(collection(db, 'conteudoLB'), (snap) => {
    S.posts = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
    const ult = Math.max(0, ...S.posts.map((p) => p.recebidoEm || 0));
    $('#sub').textContent = `${S.posts.length} post(s) · atualizado ${ult ? new Date(ult).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) : '—'}`;
    desenhar();
  }, (e) => { $('#vista').innerHTML = `<div class="aviso" style="color:var(--verm)">Sem acesso ao calendário (${esc(e.code || e.message)}). Entre com o e-mail da equipe LB.</div>`; });
});

function filtrados() {
  const b = S.busca.toLowerCase();
  return S.posts.filter((p) => (!S.f.resp || p.responsavel === S.f.resp) && (!S.f.status || p.status === S.f.status) && (!S.f.formato || p.formato === S.f.formato)
    && (!b || `${p.titulo} ${p.legenda} ${p.responsavel}`.toLowerCase().includes(b)))
    .sort((a, b2) => (a.dataPostagem || '9').localeCompare(b2.dataPostagem || '9'));
}
function opcoes(sel, rot, valores, atual) { sel.innerHTML = `<option value="">${rot}</option>` + valores.map((v) => `<option ${v === atual ? 'selected' : ''}>${esc(v)}</option>`).join(''); }

function desenhar() {
  const lista = filtrados();
  const semana = (() => { const d = new Date(hoje() + 'T12:00:00'); const ini = new Date(d); ini.setDate(d.getDate() - d.getDay()); const fim = new Date(ini); fim.setDate(ini.getDate() + 6); return [ini.toISOString().slice(0, 10), fim.toISOString().slice(0, 10)]; })();
  $('#nums').innerHTML = [
    [S.posts.length, 'posts no calendário'], [S.posts.filter((p) => p.dataPostagem >= semana[0] && p.dataPostagem <= semana[1]).length, 'postam esta semana'],
    [S.posts.filter(atrasado).length, 'atrasados / em ajuste'], [S.posts.filter((p) => p.status === 'Feed do cliente').length, 'esperando aprovação'],
    [S.posts.filter((p) => p.status === 'Postado').length, 'postados'],
  ].map(([n, r]) => `<div class="num"><b>${n}</b><span>${r}</span></div>`).join('');
  document.querySelectorAll('[data-v]').forEach((b) => b.classList.toggle('on', b.dataset.v === S.vista));
  const uniq = (k) => [...new Set(S.posts.map((p) => p[k]).filter(Boolean))].sort();
  opcoes($('#fResp'), 'Responsável', uniq('responsavel'), S.f.resp);
  opcoes($('#fStatus'), 'Status', [...new Set([...STATUS, ...uniq('status')])], S.f.status);
  opcoes($('#fFormato'), 'Formato', uniq('formato'), S.f.formato);
  if (!S.posts.length) { $('#vista').innerHTML = '<div class="aviso">Nenhum post ainda. Assim que o sistema da Potencial mandar o calendário da LB, ele aparece aqui.</div>'; return; }
  if (S.vista === 'quadro') return quadro(lista);
  if (S.vista === 'mes') return mes(lista);
  $('#vista').innerHTML = `<div class="tabela"><table><thead><tr><th>Postagem</th><th>Conteúdo</th><th>Formato</th><th>Status</th><th>Responsável</th><th>Entrega</th><th>Artes</th></tr></thead><tbody>
    ${lista.map((p) => `<tr class="linha ${atrasado(p) ? 'atras' : ''}" data-id="${esc(p.id)}"><td>${fmt(p.dataPostagem)}</td><td><strong>${esc(p.titulo || '(sem título)')}</strong>${p.legenda ? `<div class="mini">${esc(p.legenda.slice(0, 90))}${p.legenda.length > 90 ? '…' : ''}</div>` : ''}</td>
      <td>${esc(p.formato || '—')}</td><td>${pill(p.status)}</td><td>${esc(p.responsavel || '—')}</td><td style="color:${atrasado(p) ? 'var(--verm)' : 'inherit'}">${fmt(p.dataEntrega)}</td><td class="mini">${(p.midias || []).length || '—'}</td></tr>`).join('')}</tbody></table></div>`;
}
function quadro(lista) {
  const cols = [...new Set([...STATUS, ...lista.map((p) => p.status).filter(Boolean)])];
  $('#vista').innerHTML = `<div class="quadro">${cols.map((s) => { const it = lista.filter((p) => p.status === s); return `<div class="col"><h3>${pill(s)}<span class="mini">${it.length}</span></h3>
    ${it.map((p) => `<div class="cartao ${atrasado(p) ? 'atras' : ''}" data-id="${esc(p.id)}">${p.midias?.[0]?.tipo === 'imagem' ? `<img loading="lazy" src="${esc(p.midias[0].url)}" alt="">` : ''}<strong>${esc(p.titulo || '(sem título)')}</strong>
      <div class="mini">${esc(p.formato || '')} · posta ${fmt(p.dataPostagem)}${p.responsavel ? ' · ' + esc(p.responsavel) : ''}</div></div>`).join('') || '<div class="mini">—</div>'}</div>`; }).join('')}</div>`;
}
function mes(lista) {
  const [a, m] = S.mes.split('-').map(Number);
  const ini = new Date(a, m - 1, 1); const off = ini.getDay(); const total = new Date(a, m, 0).getDate();
  const celulas = [];
  const nCel = Math.ceil((off + total) / 7) * 7;
  for (let i = 0; i < nCel; i++) celulas.push(new Date(a, m - 1, 1 - off + i));
  const iso = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  const nome = ini.toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' });
  $('#vista').innerHTML = `<div class="barra"><button class="btn" id="mAnt">‹</button><strong style="text-transform:capitalize">${nome}</strong><button class="btn" id="mProx">›</button><span class="mini">${total} dias · pela data de postagem</span></div>
    <div class="mes">${DIAS.map((d) => `<div class="dsem">${d}</div>`).join('')}${celulas.map((d) => { const k = iso(d); const it = lista.filter((p) => p.dataPostagem === k);
      return `<div class="dia ${d.getMonth() !== m - 1 ? 'fora' : ''} ${k === hoje() ? 'hoje' : ''}"><div class="n">${d.getDate()}</div>${it.map((p) => `<div class="ev" data-id="${esc(p.id)}" style="border-left-color:${COR[p.status] || '#d4af5a'}" title="${esc(p.titulo)}">${esc(p.formato ? p.formato[0] + ' · ' : '')}${esc(p.titulo || '(sem título)')}</div>`).join('')}</div>`; }).join('')}</div>`;
  const mover = (n) => { const d = new Date(a, m - 1 + n, 1); S.mes = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`; desenhar(); };
  $('#mAnt').onclick = () => mover(-1); $('#mProx').onclick = () => mover(1);
}
function abrir(id) {
  const p = S.posts.find((x) => x.id === id); if (!p) return;
  $('#modal').hidden = false;
  $('#modal').innerHTML = `<div class="caixa"><div style="display:flex;gap:10px;align-items:flex-start"><div style="flex:1;min-width:0"><h2>${esc(p.titulo || '(sem título)')}</h2>
    <div class="mini">${pill(p.status)} · ${esc(p.formato || '—')} · responsável ${esc(p.responsavel || '—')}</div>
    <div class="mini" style="margin-top:4px">Entrega ${fmt(p.dataEntrega)} · Postagem ${fmt(p.dataPostagem)}${atrasado(p) ? ' · <span style="color:var(--verm)">atrasado / em ajuste</span>' : ''}</div></div>
    <button class="btn" id="fechar">Fechar</button></div>
    ${(p.midias || []).length ? `<div class="midias">${p.midias.map((x) => x.tipo === 'video' ? `<video src="${esc(x.url)}" controls preload="metadata"></video>` : `<a href="${esc(x.url)}" target="_blank" rel="noopener"><img src="${esc(x.url)}" alt="${esc(x.nome)}" loading="lazy"></a>`).join('')}</div>` : ''}
    ${p.legenda ? `<h3 style="font-size:13px;margin:14px 0 6px">Legenda</h3><div class="legenda">${esc(p.legenda)}</div>` : ''}
    ${(p.subtarefas || []).length ? `<h3 style="font-size:13px;margin:14px 0 6px">Subtarefas</h3>${p.subtarefas.map((s) => `<div>${s.feito ? '✓' : '○'} ${esc(s.titulo)} <span class="mini">${esc(s.responsavel || '')}</span></div>`).join('')}` : ''}
    ${(p.comentarios || []).length ? `<h3 style="font-size:13px;margin:14px 0 6px">Comentários</h3>${p.comentarios.map((c) => `<div style="margin-bottom:6px"><strong>${esc(c.autor)}</strong> <span class="mini">${c.quando ? new Date(c.quando).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) : ''}</span><div>${esc(c.texto)}</div></div>`).join('')}` : ''}
    ${Object.keys(p.extras || {}).length ? `<h3 style="font-size:13px;margin:14px 0 6px">Outros campos</h3>${Object.entries(p.extras).map(([k, v]) => `<div class="mini"><strong>${esc(k)}:</strong> ${esc(Array.isArray(v) ? v.join(', ') : v)}</div>`).join('')}` : ''}
    <p class="mini" style="margin-top:14px">Pra mudar este post, peça pra gerente de marketing no sistema da Potencial.</p></div>`;
  $('#fechar').onclick = () => { $('#modal').hidden = true; };
}
document.addEventListener('click', (e) => {
  const v = e.target.closest('[data-v]'); if (v) { S.vista = v.dataset.v; gravar('ceVista', S.vista); desenhar(); return; }
  const it = e.target.closest('[data-id]'); if (it && !e.target.closest('#modal .caixa')) { abrir(it.dataset.id); return; }
  if (e.target.id === 'modal') $('#modal').hidden = true;
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') $('#modal').hidden = true; });
$('#busca').oninput = (e) => { S.busca = e.target.value; desenhar(); };
for (const [id, k] of [['#fResp', 'resp'], ['#fStatus', 'status'], ['#fFormato', 'formato']]) $(id).onchange = (e) => { S.f[k] = e.target.value; gravar('ceFiltro', S.f); desenhar(); };
</script>
</body>
</html>
